name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build read-only site artifact
        run: |
          mkdir _site
          cp index.html friends.html styles.css script.js friends.js content.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/assets
          cp -R astraia _site/astraia

      - name: Sync and verify Astraia assets on R2
        if: vars.ASTRAIA_R2_ASSET_ORIGIN != ''
        env:
          ASTRAIA_R2_ASSET_ORIGIN: ${{ vars.ASTRAIA_R2_ASSET_ORIGIN }}
          ASTRAIA_R2_ENDPOINT: ${{ vars.ASTRAIA_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRAIA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRAIA_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY"
          python3 -m venv "$RUNNER_TEMP/astraia-r2-python"
          "$RUNNER_TEMP/astraia-r2-python/bin/python" -m pip install 'boto3==1.40.82'
          "$RUNNER_TEMP/astraia-r2-python/bin/python" .github/scripts/astraia_r2.py _site/astraia --upload

      - name: Report published site size
        run: |
          bytes=$(du -sb _site | cut -f1)
          files=$(find _site -type f | wc -l)
          echo "### Published site capacity" >> "$GITHUB_STEP_SUMMARY"
          echo "Site artifact: $bytes bytes, $files files." >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -ge 900000000 ]; then
            echo "::warning::Published site exceeds 900 MB; review large generated assets before the GitHub Pages 1 GB limit."
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
