name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build read-only site artifact
        run: |
          mkdir _site
          cp index.html friends.html styles.css script.js friends.js content.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/assets
          cp -R astraia _site/astraia

      - name: Test R2 taxonomy handling
        run: python3 -m unittest discover -s .github/tests -p 'test_astraia_r2.py'

      - name: Reuse existing assets and sync R2 at 800 MB
        env:
          ASTRAIA_R2_ASSET_ORIGIN: ${{ vars.ASTRAIA_R2_ASSET_ORIGIN }}
          ASTRAIA_R2_ENDPOINT: ${{ vars.ASTRAIA_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRAIA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRAIA_R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$ASTRAIA_R2_ASSET_ORIGIN"
          test -n "$ASTRAIA_R2_ENDPOINT"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          python3 -m venv "$RUNNER_TEMP/astraia-r2-python"
          "$RUNNER_TEMP/astraia-r2-python/bin/python" -m pip install 'boto3==1.40.76'
          "$RUNNER_TEMP/astraia-r2-python/bin/python" .github/scripts/astraia_r2.py _site/astraia --upload --reuse-until-bytes 800000000 --artifact-root _site

      - name: Report published site size
        run: |
          bytes=$(find _site -type f -printf '%s\n' | awk '{ sum += $1 } END { printf "%.0f", sum }')
          files=$(find _site -type f | wc -l)
          echo "Site artifact: $bytes bytes, $files files."
          echo "### Published site capacity" >> "$GITHUB_STEP_SUMMARY"
          echo "Site artifact: $bytes bytes, $files files." >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -ge 800000000 ]; then
            echo "::warning::Published site exceeds 800 MB after resource handling; review capacity before the GitHub Pages 1 GB limit."
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
