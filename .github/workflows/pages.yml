name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build read-only site artifact
        run: |
          mkdir _site
          cp index.html friends.html styles.css script.js friends.js content.js robots.txt sitemap.xml .nojekyll _site/
          cp -R assets _site/assets
          cp -R astraia _site/astraia

      - name: Report published site size
        run: |
          bytes=$(du -sb _site | cut -f1)
          files=$(find _site -type f | wc -l)
          echo "### Published site capacity" >> "$GITHUB_STEP_SUMMARY"
          echo "Site artifact: $bytes bytes, $files files." >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -ge 900000000 ]; then
            echo "::warning::Published site exceeds 900 MB; review large generated assets before the GitHub Pages 1 GB limit."
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
