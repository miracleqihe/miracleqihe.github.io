<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASTRAIA · 朔望叠影</title>

  <style>
    :root {
      --void-deep: #050811;
      --void-mid: #090e18;
      --brass-gold: #cfa962;
      --brass-bright: #f0d79c;
      --brass-hairline: rgba(207, 169, 98, 0.28);
      --brass-faint: rgba(207, 169, 98, 0.12);
      --obsidian-glass: rgba(11, 15, 24, 0.92);
      --obsidian-deep: rgba(6, 9, 16, 0.95);
      --ink-ivory: #efe9dc;
      --ink-muted: #a69f90;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 47% 50%, #0b1224 0%, #060a14 55%, #04060d 100%);
      color: var(--ink-ivory);
      font-family: 'Noto Serif SC', Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    .font-cinzel { font-family: 'Cinzel', 'Cormorant Garamond', serif; }
    .font-cormorant { font-family: 'Cormorant Garamond', 'Noto Serif SC', serif; }
    .font-serif-sc { font-family: 'Noto Serif SC', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    /* Full-screen 3D Canvas */
    #webgl-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Subtle Astrolabe Degree Ticks & Atmospheric Vignette */
    .astrolabe-bezel {
      position: fixed;
      inset: 52px 0 0 0;
      pointer-events: none;
      z-index: 8;
      background: radial-gradient(circle at 46% 50%, transparent 56%, rgba(3, 5, 11, 0.68) 100%);
    }

    .bezel-scale-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      border-bottom: 1px solid rgba(207, 169, 98, 0.14);
      background-image: repeating-linear-gradient(
        to right,
        rgba(207, 169, 98, 0.28) 0px,
        rgba(207, 169, 98, 0.28) 1px,
        transparent 1px,
        transparent 28px
      );
    }

    /* Bespoke Celestial Obsidian Panels */
    .celestial-panel {
      background: var(--obsidian-glass);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      border: 1px solid var(--brass-hairline);
      box-shadow: 0 20px 56px rgba(0, 0, 0, 0.68), inset 0 0 0 1px rgba(255, 244, 218, 0.04);
      border-radius: 0;
    }

    /* Custom Scrollbars */
    .astro-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .astro-scroll::-webkit-scrollbar-track { background: transparent; }
    .astro-scroll::-webkit-scrollbar-thumb { background: rgba(207, 169, 98, 0.28); }
    .astro-scroll::-webkit-scrollbar-thumb:hover { background: rgba(207, 169, 98, 0.56); }

    /* Navigation & Interactive Buttons (harmonized 1:1 with Classic Topbar) */
    .dim-tab {
      position: relative;
      padding: 6px 14px;
      font-size: 12.5px;
      letter-spacing: 0.04em;
      color: rgba(239, 236, 230, 0.74);
      border-right: 1px solid rgba(207, 169, 98, 0.24);
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }
    .dim-tab:last-child { border-right: none; }
    .dim-tab:hover {
      color: #fff8eb;
      background: rgba(207, 169, 98, 0.11);
    }
    .dim-tab.active {
      background: linear-gradient(180deg, rgba(207, 169, 98, 0.26) 0%, rgba(207, 169, 98, 0.08) 100%);
      color: #fff6e0;
      box-shadow: inset 0 -2px 0 var(--brass-gold);
    }

    /* Prominent Bridge Toggle */
    .syzygy-btn {
      border: 1px solid rgba(207, 169, 98, 0.36);
      background: rgba(9, 14, 24, 0.88);
      color: rgba(239, 236, 230, 0.78);
      transition: all 0.22s ease;
      border-radius: 0;
    }
    .syzygy-btn.active {
      background: linear-gradient(135deg, rgba(207, 169, 98, 0.26) 0%, rgba(126, 102, 214, 0.2) 100%);
      border-color: var(--brass-bright);
      color: #fff9eb;
      box-shadow: 0 0 18px rgba(207, 169, 98, 0.24);
    }

    .ctl-btn {
      border: 1px solid var(--brass-hairline);
      background: rgba(9, 14, 24, 0.82);
      color: rgba(239, 236, 230, 0.8);
      border-radius: 0;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }
    .ctl-btn:hover {
      border-color: var(--brass-bright);
      color: #fff;
      background: rgba(207, 169, 98, 0.14);
    }
    .ctl-btn.active {
      border-color: var(--brass-gold);
      color: var(--brass-bright);
      background: rgba(207, 169, 98, 0.2);
    }

    /* Bottom Curated Syzygy Trail Pills */
    .trail-pill {
      padding: 5px 10px;
      border: 1px solid rgba(207, 169, 98, 0.2);
      background: rgba(8, 12, 22, 0.82);
      color: rgba(232, 224, 208, 0.78);
      border-radius: 0;
      font-size: 11.5px;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .trail-pill:hover {
      border-color: rgba(207, 169, 98, 0.56);
      color: #fff8e8;
    }
    .trail-pill.active {
      background: linear-gradient(135deg, rgba(207, 169, 98, 0.24), rgba(82, 209, 162, 0.12));
      border-color: var(--brass-bright);
      color: #fff9eb;
      box-shadow: 0 0 14px rgba(207, 169, 98, 0.2);
    }

    /* 3D Projected World Anchors */
    #world-labels {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 11;
      overflow: hidden;
    }

    .world-tag {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.22s ease, transform 0.2s ease;
      will-change: left, top, opacity;
    }
    .world-tag:hover {
      transform: translate(-50%, calc(-50% - 2px)) scale(1.04);
      z-index: 25;
    }

    .vol-plaque {
      padding: 4px 10px 5px;
      background: rgba(7, 11, 20, 0.82);
      border: 1px solid rgba(207, 169, 98, 0.3);
      backdrop-filter: blur(6px);
      border-radius: 0;
      text-align: center;
      white-space: nowrap;
    }
    .vol-plaque.wormhole-plaque {
      border-color: rgba(240, 215, 156, 0.62);
      box-shadow: 0 0 16px rgba(240, 215, 156, 0.16);
    }

    .motif-anchor-chip {
      padding: 3px 9px;
      background: rgba(11, 14, 28, 0.88);
      border: 1px solid rgba(207, 169, 98, 0.45);
      border-radius: 0;
      font-size: 11px;
      color: #f4ecda;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .motif-anchor-chip:hover {
      border-color: var(--brass-bright);
      color: #fff;
      box-shadow: 0 0 14px rgba(207, 169, 98, 0.32);
    }

    /* Animated Brass Celestial Reticle */
    #astrolabe-reticle {
      position: fixed;
      width: 46px;
      height: 46px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.18s ease;
      will-change: left, top, opacity;
    }
    @keyframes slowAstrolabeSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .reticle-svg {
      width: 100%;
      height: 100%;
      animation: slowAstrolabeSpin 16s linear infinite;
    }

    /* Crisp Floating Tooltip */
    #celestial-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.14s ease;
      max-width: 295px;
    }

    /* Slide-out Drawers */
    .drawer-anim {
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    }
    .drawer-left-hidden {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }
    .drawer-right-hidden {
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
    }
  </style>
