<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">显微比较可观察颗粒的大小、轮</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">廓与表面结构。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">多个颗粒的组合可提供环境比较</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">线索。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">风、水和物品接触均可能造成转</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">移。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">颗粒形态和背景因物种、地点与季节而异，不能只凭一粒确定去向。</text>
