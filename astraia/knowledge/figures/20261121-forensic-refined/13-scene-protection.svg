<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">现场保护：安全路线与位置关系</title>
<desc id="desc">俯视示意，优先医疗救助和人员安全</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">现场保护：安全路线与位置关系</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">俯视示意，优先医疗救助和人员安全</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<rect x="140" y="90" width="510" height="320" rx="8" fill="#f1f4ec" stroke="#9eada1" stroke-width="4"/><path d="M140 310 h220 M430 310 h220 M360 310 v100 M430 310 v100" fill="none" stroke="#9eada1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="235" y="140" width="120" height="70" rx="8" fill="#dce7db" stroke="#90a696" stroke-width="3"/><circle cx="480" cy="230" r="12" fill="#a96d70" stroke="none" stroke-width="3"/><path d="M420 350 h120" fill="none" stroke="#b6c4b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="615" y1="442" x2="500" y2="355" stroke="#6f9580" stroke-width="4" stroke-linecap="round"/><path d="M 514.8 357.5 L 500 355 L 506.4 368.6" fill="none" stroke="#6f9580" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="190" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">家具</text><text x="490" y="199" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">可能痕迹</text><text x="596" y="474" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">安全接近路线</text><circle cx="675" cy="392" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="480" cy="279" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="145" cy="134" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">先辨认火、电、烟或结构危险，</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">在安全处呼救。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">记录物品与门、家具等固定参照</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">的关系。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">救援时发生的开门、移动或剪衣</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">应告知接警人员。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不要为了拍照或寻找物证返回危险区域。</text>
</g></svg>