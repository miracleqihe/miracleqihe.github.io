<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">药物变化后：出汗、发抖与意识</title>
<desc id="desc">可能是血清素综合征，也可能与其他情况重叠</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">药物变化后：出汗、发抖与意识</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">可能是血清素综合征，也可能与其他情况重叠</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(250 85) scale(1.15)"><circle cx="0" cy="0" r="30" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M -35 40 Q 0 30 35 40 L 45 145 L 29 164 L 23 290 L 5 290 L 0 170 L -5 290 L -23 290 L -29 164 L -45 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -34 49 L -72 155 M 34 49 L 72 155" fill="none" stroke="#b49284" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M207 105 q45-40 85 0" fill="none" stroke="#a96d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 324 131 Q 307 154 309 163 Q 324 181 339 163 Q 341 154 324 131 Z" fill="#6b929b" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 245 l-18 10 14 11 M330 245 l18 10-14 11" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 250 268 Q 233 291 235 300 Q 250 318 265 300 Q 267 291 250 268 Z" fill="#a07e59" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="115" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="330" cy="225" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="330" cy="300" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><text x="472" y="145" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">意识与体温</text><text x="472" y="240" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">出汗、发抖</text><text x="472" y="335" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">腹泻、心跳快</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">新药、加量或合用后可有烦躁、</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出汗和发抖。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">腹泻、心跳加快、肌肉抽动或发</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">热也可能出现。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">高热、抽搐或意识异常时立即急</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">救并提供药物清单。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不要自行使用所谓拮抗药，治疗由医护评估。</text>
</g></svg>