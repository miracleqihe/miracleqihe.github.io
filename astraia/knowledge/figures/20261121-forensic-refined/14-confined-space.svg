<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">有限空间：气味不能证明安全</title>
<desc id="desc">井、槽或地下空间可能缺氧或积聚有毒气体</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">有限空间：气味不能证明安全</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">井、槽或地下空间可能缺氧或积聚有毒气体</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<line x1="105" y1="210" x2="700" y2="210" stroke="#938b80" stroke-width="9" stroke-linecap="round"/><rect x="280" y="210" width="190" height="225" rx="8" fill="#e5e8e3" stroke="#929e95" stroke-width="4"/><ellipse cx="375" cy="210" rx="102" ry="24" fill="#cbd4cc" stroke="#929e95" stroke-width="4"/><path d="M330 330 q40-20 80 0" fill="none" stroke="#9ba69c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 290 q30-20 60 0 M330 255 q45-20 90 0" fill="none" stroke="#b9c4b9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(580 110) scale(0.63)"><circle cx="0" cy="0" r="30" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M -35 40 Q 0 30 35 40 L 45 145 L 29 164 L 23 290 L 5 290 L 0 170 L -5 290 L -23 290 L -29 164 L -45 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -34 49 L -72 155 M 34 49 L 72 155" fill="none" stroke="#b49284" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="560" y="80" width="42" height="75" rx="8" fill="#fffdf8" stroke="#8da3a0" stroke-width="3"/><text x="590" y="60" font-size="26" fill="#293e44" font-weight="400" text-anchor="middle">在安全处呼救</text><text x="375" y="472" font-size="26" fill="#293e44" font-weight="400" text-anchor="middle">空间内空气可能缺氧或有毒</text><circle cx="375" cy="170" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="600" cy="196" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">有人倒地时，旁人不要盲目进入</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">或下井。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">在安全位置报警，说明空间位置</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">与可能的气体危险。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">具备检测、呼吸防护与救援装备</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">的人员处理。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">气味微弱或闻不到，并不说明空气适合呼吸。</text>
</g></svg>