<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">肺血栓栓塞：从腿部到肺循环</title>
<desc id="desc">箭头仅表示可能的血流方向</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">肺血栓栓塞：从腿部到肺循环</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">箭头仅表示可能的血流方向</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(270 75) scale(1.1)"><circle cx="0" cy="0" r="30" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M -35 40 Q 0 30 35 40 L 45 145 L 29 164 L 23 290 L 5 290 L 0 170 L -5 290 L -23 290 L -29 164 L -45 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -34 49 L -72 155 M 34 49 L 72 155" fill="none" stroke="#b49284" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(270 164) scale(0.6)"><path d="M 0 24 Q -48 5 -68 38 Q -83 76 -66 106 Q -45 133 0 108 M 0 24 Q 48 5 68 38 Q 83 76 66 106 Q 45 133 0 108" fill="#e5c2bc" stroke="#ae8680" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-35" x2="0" y2="65" stroke="#6b929b" stroke-width="7" stroke-linecap="round"/></g><circle cx="270" cy="245" r="15" fill="#c98d8c" stroke="none" stroke-width="3"/><path d="M 260 398 Q 243 421 245 430 Q 260 448 275 430 Q 277 421 260 398 Z" fill="#a96d70" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><line x1="350" y1="425" x2="455" y2="360" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><path d="M 447.3 372.9 L 455 360 L 440.0 361.1" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="455" y1="360" x2="455" y2="245" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><path d="M 461.9 258.3 L 455 245 L 448.1 258.3" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="455" y1="245" x2="300" y2="245" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><path d="M 313.3 238.1 L 300 245 L 313.3 251.9" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="270" y1="227" x2="270" y2="204" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><path d="M 276.9 217.3 L 270 204 L 263.1 217.3" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="216" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">肺动脉</text><text x="510" y="287" font-size="25" fill="#596b6d" font-weight="400" text-anchor="start">经心脏的血流方向示意</text><text x="510" y="425" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">下肢深静脉</text><circle cx="350" cy="423" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="350" cy="170" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">深静脉血栓可出现在下肢或其他</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">部位。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">部分血栓可能脱落并随血流到达</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">肺动脉。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">单侧腿肿痛应就医；突发气短、</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">胸痛或晕厥立即呼救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">并非每个人都有腿部症状，也不能凭外观确定肺栓塞。</text>
</g></svg>