<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">轮胎痕迹：印迹宽度、轮距和轴距</title>
<desc id="desc">俯视车辆示意，轮胎位置和尺寸均为示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">轮胎痕迹：印迹宽度、轮距和轴距</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">俯视车辆示意，轮胎位置和尺寸均为示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<rect x="258" y="140" width="250" height="240" rx="8" fill="#e6eeea" stroke="#9caea5" stroke-width="3"/><rect x="220" y="125" width="30" height="76" rx="8" fill="#9aa9a3" stroke="#778d84" stroke-width="3"/><rect x="510" y="125" width="30" height="76" rx="8" fill="#9aa9a3" stroke="#778d84" stroke-width="3"/><rect x="220" y="320" width="30" height="76" rx="8" fill="#9aa9a3" stroke="#778d84" stroke-width="3"/><rect x="510" y="320" width="30" height="76" rx="8" fill="#9aa9a3" stroke="#778d84" stroke-width="3"/><line x1="235" y1="163" x2="525" y2="163" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><line x1="235" y1="358" x2="525" y2="358" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><line x1="235" y1="95" x2="525" y2="95" stroke="#a96d70" stroke-width="4" stroke-linecap="round"/><path d="M 511.7 101.9 L 525 95 L 511.7 88.1" fill="none" stroke="#a96d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="575" y1="163" x2="575" y2="358" stroke="#6b929b" stroke-width="4" stroke-linecap="round"/><path d="M 568.1 344.7 L 575 358 L 581.9 344.7" fill="none" stroke="#6b929b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="220" y1="233" x2="250" y2="233" stroke="#6f9580" stroke-width="4" stroke-linecap="round"/><path d="M 236.7 239.9 L 250 233 L 236.7 226.1" fill="none" stroke="#6f9580" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="74" font-size="28" fill="#293e44" font-weight="700" text-anchor="middle">轮距</text><text x="595" y="268" font-size="28" fill="#293e44" font-weight="700" text-anchor="start">轴距</text><text x="155" y="272" font-size="26" fill="#293e44" font-weight="400" text-anchor="middle">单条印迹宽度</text><circle cx="380" cy="116" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="613" cy="312" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="185" cy="190" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">单条印迹宽度反映接地部分，受</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">轮胎与路面影响。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">轮距指同一车轴左右轮中心的距</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">离。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">轴距指前后轴中心间的距离。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">必须先判断痕迹之间的关系，再按方法估计；不能凭两道印断定车型。</text>
</g></svg>