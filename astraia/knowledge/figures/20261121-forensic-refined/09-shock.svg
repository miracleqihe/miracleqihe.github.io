<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">失血与休克：外表不一定看得见</title>
<desc id="desc">示意内部可出血区域，并非逐项自查诊断</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">失血与休克：外表不一定看得见</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">示意内部可出血区域，并非逐项自查诊断</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(250 100) scale(1.15)"><circle cx="0" cy="0" r="30" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M -35 40 Q 0 30 35 40 L 45 145 L 29 164 L 23 290 L 5 290 L 0 170 L -5 290 L -23 290 L -29 164 L -45 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -34 49 L -72 155 M 34 49 L 72 155" fill="none" stroke="#b49284" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M 250 199 Q 233 222 235 231 Q 250 249 265 231 Q 267 222 250 199 Z" fill="#a96d70" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 241 288 Q 224 311 226 320 Q 241 338 256 320 Q 258 311 241 288 Z" fill="#a96d70" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 375 l30 16 M330 395 l34 15" fill="none" stroke="#a96d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="355" y1="210" x2="476" y2="165" stroke="#6b929b" stroke-width="4" stroke-linecap="round"/><path d="M 465.9 176.1 L 476 165 L 461.1 163.1" fill="none" stroke="#6b929b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="352" y1="296" x2="476" y2="295" stroke="#6b929b" stroke-width="4" stroke-linecap="round"/><path d="M 462.8 302.0 L 476 295 L 462.6 288.2" fill="none" stroke="#6b929b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="175" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">胸腹、骨盆</text><text x="500" y="310" font-size="27" fill="#293e44" font-weight="400" text-anchor="start">长骨周围</text><text x="250" y="495" font-size="26" fill="#596b6d" font-weight="400" text-anchor="middle">体表无明显出血也需评估</text><circle cx="325" cy="205" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="326" cy="298" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/><circle cx="392" cy="400" r="7" fill="#fffdf8" stroke="#a07e59" stroke-width="2"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">胸腹部、骨盆与长骨周围可能发</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">生隐藏性出血。</text>
<circle cx="985" cy="314" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">头晕、冷汗、口渴、呼吸快或反</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">应变慢都值得重视。</text>
<circle cx="985" cy="469" r="5" fill="#a07e59" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">症状不一定按固定顺序出现；严</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">重情况立即求救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">一次血压看似正常，也不能单独排除持续出血。</text>
</g></svg>