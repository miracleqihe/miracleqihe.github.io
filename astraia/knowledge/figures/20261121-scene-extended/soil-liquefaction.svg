<text x="600" y="478" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">液化风险还取决于土层、水位、摇晃强度及工程条件。</text>
