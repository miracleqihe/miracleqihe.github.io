<text x="220" y="448" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">震源</text>
<path d="M 245 385 Q 320 338 350 280 M 250 400 Q 480 350 560 280 M 250 415 Q 690 372 900 280" fill="none" stroke="#c9a978" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7"/>
<text x="295" y="155" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">甲地烈度</text>
<text x="620" y="155" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">乙地烈度</text>
<text x="947" y="155" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">丙地烈度</text>
<text x="600" y="485" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">各地烈度受距离、震源深度、场地与建筑条件等影响，远近不是唯一因素。</text>
