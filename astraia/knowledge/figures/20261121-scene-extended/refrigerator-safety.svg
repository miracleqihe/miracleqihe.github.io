<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">冰箱收纳：控温、密封、生熟分开</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">冰箱温度需用温度计核对；食品保存时间随种类而异。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
