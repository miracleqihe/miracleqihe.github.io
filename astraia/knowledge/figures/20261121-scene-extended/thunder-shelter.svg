<path d="M 468.5 296.0 L 480 290 L 468.5 284.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 540 330 L 540 235 L 625 185 L 710 235 L 710 330 Z" fill="#e9e3d8" stroke="#938b7e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
