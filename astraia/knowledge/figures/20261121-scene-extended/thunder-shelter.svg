<circle cx="1000" cy="325" r="18" fill="#fff" stroke="#263b3e" stroke-width="3"/>
<text x="945" y="380" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">关窗的金属硬顶车辆</text>
<text x="600" y="478" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">最后一次雷声后，在安全遮蔽处至少等待 30 分钟再继续户外活动。</text>
