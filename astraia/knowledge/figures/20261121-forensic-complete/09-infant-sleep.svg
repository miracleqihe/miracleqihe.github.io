<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">婴儿睡眠环境：仰卧与独立睡眠面</title>
<desc id="desc">婴儿床从上方观察的布置示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">婴儿睡眠环境：仰卧与独立睡眠面</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">婴儿床从上方观察的布置示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<rect x="95" y="85" width="540" height="350" rx="20" fill="#e0eadf" stroke="#91aa98" stroke-width="5"/><rect x="120" y="110" width="490" height="300" rx="10" fill="#fffdf8" stroke="#c1cec2" stroke-width="3"/><circle cx="365" cy="176" r="53" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M310 230 Q365 206 420 230 L417 305 Q366 329 312 305Z" fill="#dbe6ee" stroke="#95afbb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 249 L276 280 M410 249 L454 280 M335 314 L319 356 M395 314 L411 356" fill="none" stroke="#b49284" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="349" cy="177" r="3" fill="#293e44" stroke="none" stroke-width="3"/><circle cx="380" cy="177" r="3" fill="#293e44" stroke="none" stroke-width="3"/><path d="M355 195 q10 8 20 0" fill="none" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="365" y1="164" x2="655" y2="143" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="365" cy="164" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="663" y="151" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">仰卧</text><line x1="610" y1="225" x2="655" y2="234" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="610" cy="225" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="663" y="242" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">独立、平坦睡眠面</text><line x1="562" y1="355" x2="655" y2="325" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="562" cy="355" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="663" y="333" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">床内不放松软物品</text><text x="366" y="474" font-size="25" fill="#596b6d" font-weight="400" text-anchor="middle">俯视：每次睡眠均仰卧</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">每次睡眠都仰卧，使用坚实平坦</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">的床面。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">同室不同床，婴儿有独立睡眠空</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">间。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">床内不放枕头、软玩具或松散寝</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">具。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">睡眠相关死亡需要结合现场、健康资料和调查结果。</text>
</g></svg>