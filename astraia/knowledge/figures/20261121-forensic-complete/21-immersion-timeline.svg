<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">水中发现：记录不同时间节点</title>
<desc id="desc">时间轴标记证实的观察，未见不等于未发生</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">水中发现：记录不同时间节点</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">时间轴标记证实的观察，未见不等于未发生</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<line x1="100" y1="230" x2="745" y2="230" stroke="#668f98" stroke-width="6" stroke-linecap="round"/><line x1="100" y1="230" x2="745" y2="230" stroke="#668f98" stroke-width="5" stroke-linecap="round"/><path d="M 733.6 236.2 L 745 230 L 733.6 223.8" fill="none" stroke="#668f98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="130" cy="230" r="12" fill="#719481" stroke="none" stroke-width="3"/><line x1="130" y1="230" x2="130" y2="300" stroke="#719481" stroke-width="3" stroke-linecap="round"/><circle cx="320" cy="230" r="12" fill="#a7835a" stroke="none" stroke-width="3"/><line x1="320" y1="230" x2="320" y2="300" stroke="#a7835a" stroke-width="3" stroke-linecap="round"/><circle cx="520" cy="230" r="12" fill="#668f98" stroke="none" stroke-width="3"/><line x1="520" y1="230" x2="520" y2="300" stroke="#668f98" stroke-width="3" stroke-linecap="round"/><circle cx="700" cy="230" r="12" fill="#af7072" stroke="none" stroke-width="3"/><line x1="700" y1="230" x2="700" y2="300" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><text x="130" y="342" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">最后联系</text><text x="320" y="342" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">目击入水</text><text x="520" y="342" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">发现</text><text x="700" y="342" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">打捞</text><path d="M320 163 Q410 115 520 163" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="139" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">经过未必完整</text><path d="M160 410 Q200 395 240 410 T320 410 T400 410 T480 410 T560 410 T640 410" fill="none" stroke="#668f98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">记录最后联系、已知入水、发现</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">及打捞时间。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">有些节点可能没有目击或记录。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">浸水后的皮肤起皱可发生在活人</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">和死者身上。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">浸水经过与死亡时间需结合多条证据分别调查。</text>
</g></svg>