19" font-size="23" fill="#293e44" font-weight="400" text-anchor="middle">颅骨与硬脑膜之间</text><text x="429" y="419" font-size="23" fill="#293e44" font-weight="400" text-anchor="middle">硬脑膜与蛛网膜之间</text><text x="673" y="419" font-size="23" fill="#293e44" font-weight="400" text-anchor="middle">脑实质内</text><rect x="104" y="455" width="18" height="18" rx="8" fill="#d2dcd6" stroke="none" stroke-width="2"/><text x="131" y="473" font-size="23" fill="#293e44" font-weight="400" text-anchor="start">颅骨</text><rect x="249" y="455" width="18" height="18" rx="8" fill="#879e97" stroke="none" stroke-width="2"/><text x="276" y="473" font-size="23" fill="#293e44" font-weight="400" text-anchor="start">硬脑膜</text><rect x="420" y="455" width="18" height="18" rx="8" fill="#d3c4a6" stroke="none" stroke-width="2"/><text x="447" y="473" font-size="23" fill="#293e44" font-weight="400" text-anchor="start">蛛网膜</text><rect x="617" y="455" width="18" height="18" rx="8" fill="#af7072" stroke="none" stroke-width="2"/><text x="644" y="473" font-size="23" fill="#293e44" font-weight="400" text-anchor="start">出血位置</text>
