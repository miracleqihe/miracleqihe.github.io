<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">DNA 检测回答个体来源相关问</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">题。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">样本状态、方法和对照结果由专业实验室综合评估。</text>
