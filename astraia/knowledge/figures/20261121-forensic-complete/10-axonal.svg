<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">轴索损伤：可能受累的位置</title>
<desc id="desc">脑侧面剖面示意，标出几处常见位置</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">轴索损伤：可能受累的位置</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">脑侧面剖面示意，标出几处常见位置</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M115 275 Q85 135 200 95 Q310 35 425 118 Q520 201 465 296 Q440 350 362 359 Q325 408 286 423 L255 360 Q158 359 115 275Z" fill="#e4cec2" stroke="#b79c90" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 260 Q132 165 217 130 Q315 80 410 144 Q473 202 435 280 Q409 322 352 320 Q285 340 222 315 Q169 304 145 260Z" fill="#f2e5d8" stroke="#d1b6a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 222 Q280 175 340 218 Q310 227 280 250 Q250 229 226 222Z" fill="#d2d9cc" stroke="#98a698" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M321 320 Q335 356 315 386" fill="none" stroke="#aa9386" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="188" cy="156" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M181 149 l14 14 M195 149 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="235" cy="135" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M228 128 l14 14 M242 128 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="382" cy="158" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M375 151 l14 14 M389 151 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="228" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M413 221 l14 14 M427 221 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="258" cy="217" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M251 210 l14 14 M265 210 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="321" cy="217" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M314 210 l14 14 M328 210 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="321" cy="344" r="8" fill="#af7072" stroke="none" stroke-width="3"/><path d="M314 337 l14 14 M328 337 l-14 14" fill="none" stroke="#fff7f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="188" y1="156" x2="550" y2="120" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="188" cy="156" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="558" y="128" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">灰白质交界</text><line x1="283" y1="219" x2="550" y2="220" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="283" cy="219" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="558" y="228" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">胼胝体</text><line x1="321" y1="344" x2="550" y2="320" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="321" cy="344" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="558" y="328" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">脑干</text><text x="495" y="423" font-size="24" fill="#596b6d" font-weight="400" text-anchor="start">标点只示意可能受累的位置</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">损伤可涉及灰白质交界、胼胝体</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">或脑干。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">各处不必同时受累，病变也可能</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不易在早期 CT 看见。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">持续意识异常或症状加重，立即</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">呼叫急救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">示意点不代表实际影像，也不能根据症状自行确诊。</text>
</g></svg>