<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">头皮附近通常对应较近期的生</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">长。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不同人和不同毛囊的生长速度、</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">周期会变化。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">汗液、外界污染和染烫均可能影</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">响检验结果。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">分段检测不能直接还原每天服用的精确剂量。</text>
