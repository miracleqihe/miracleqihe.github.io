<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">毛发分段：近根方向与时间解释</title>
<desc id="desc">头皮、毛干和分段方向示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">毛发分段：近根方向与时间解释</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">头皮、毛干和分段方向示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M75 290 Q75 175 150 150 Q210 140 250 205 L250 290Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 190 Q253 186 330 190 H735" fill="none" stroke="#806a5e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M195 190 Q253 186 330 190 H735" fill="none" stroke="#bba393" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="330" y1="160" x2="330" y2="220" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><line x1="470" y1="160" x2="470" y2="220" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><line x1="610" y1="160" x2="610" y2="220" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><text x="190" y="342" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">头皮</text><text x="395" y="264" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">近根段</text><text x="540" y="264" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">中间段</text><text x="665" y="264" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">远端</text><line x1="345" y1="315" x2="675" y2="315" stroke="#a7835a" stroke-width="4" stroke-linecap="round"/><path d="M 663.6 321.2 L 675 315 L 663.6 308.8" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="371" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">一般对应较早生长时期</text><text x="430" y="445" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">记录近根方向、段长及染烫等情况</text>
