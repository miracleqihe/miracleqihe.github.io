<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">气道异物：阻塞位置和呼吸</title>
<desc id="desc">口腔、喉、气管和分叉的关系示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">气道异物：阻塞位置和呼吸</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">口腔、喉、气管和分叉的关系示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M164 90 Q110 100 117 175 Q125 213 158 222 L165 260 L253 260 L253 145 Q238 96 199 90Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M121 180 Q156 173 188 181" fill="none" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 192 V325 M222 192 V325" fill="none" stroke="#668f98" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M192 325 Q170 340 138 357 M222 325 Q245 340 274 357" fill="none" stroke="#668f98" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="207" cy="257" r="17" fill="#a7835a" stroke="#8e7252" stroke-width="3"/><line x1="207" y1="257" x2="358" y2="185" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="207" cy="257" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="366" y="193" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">可能的阻塞处</text><line x1="215" y1="328" x2="358" y2="290" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="215" cy="328" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="366" y="298" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">气管分叉</text><text x="145" y="414" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">口腔</text><text x="285" y="414" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">支气管</text><path d="M345 365 h245" fill="none" stroke="#c3d2c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="358" y="405" font-size="24" fill="#596b6d" font-weight="400" text-anchor="start">有效咳嗽与不能发声要分开观察</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">吃东西时突然不能说话或有效咳</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">嗽，立即求助。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">还能有效咳嗽时鼓励咳嗽并留意</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">变化。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">若无反应且无正常呼吸，按急救</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">调度指导处理。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不同年龄的噎堵急救方法不同，遵从当地急救指导。</text>
</g></svg>