<text x="75" y="164" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">故事时间</text>
<line x1="240" y1="155" x2="1070" y2="155" stroke="#326f80" stroke-width="3"/>
<path d="M 1058.5 161.0 L 1070 155 L 1058.5 149.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="300" cy="155" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<text x="300" y="208" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">出门</text>
<circle cx="610" cy="155" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<text x="610" y="208" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">发现遗失</text>
<circle cx="920" cy="155" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<text x="920" y="208" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">找到物品</text>
<text x="75" y="303" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">文本顺序</text>
<line x1="240" y1="295" x2="1070" y2="295" stroke="#a94d37" stroke-width="3"/>
<path d="M 1058.5 301.0 L 1070 295 L 1058.5 289.0" fill="none" stroke="#a94d37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="300" cy="295" r="9" fill="#a94d37" stroke="#a94d37" stroke-width="2"/>
<text x="300" y="348" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">发现遗失</text>
<circle cx="610" cy="295" r="9" fill="#a94d37" stroke="#a94d37" stroke-width="2"/>
<text x="610" y="348" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">回忆出门</text>
<circle cx="920" cy="295" r="9" fill="#a94d37" stroke="#a94d37" stroke-width="2"/>
<text x="920" y="348" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">找到物品</text>
<path d="M 300 225 C 300 260 610 250 610 277" fill="none" stroke="#9fb6a9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<path d="M 610 225 C 610 260 300 250 300 277" fill="none" stroke="#c99e8d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="600" y="456" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">把叙述次序和事件次序分别列出，有助于识别倒叙、插叙和信息延迟。</text>
</svg>