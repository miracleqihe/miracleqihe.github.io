<text x="600" y="479" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">类别定义与样本选择会改变结论，表格本身不能解释流动原因。</text>
