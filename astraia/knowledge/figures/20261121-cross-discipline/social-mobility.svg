<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">假想样本 100 人；行表示家庭出身类别，列表示成年后的类别。</text>
