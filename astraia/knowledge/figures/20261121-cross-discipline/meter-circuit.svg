<text x="600" y="412" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">电流表接入电流路径；电压表跨接被测部件两端。</text>
<text x="600" y="482" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">不要将电流挡直接跨接电源；市电测量应由合格人员进行。</text>
