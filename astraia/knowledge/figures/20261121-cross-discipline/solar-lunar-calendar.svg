<path d="M 988.5 208.0 L 1000 202 L 988.5 196.0" fill="none" stroke="#bb8737" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="1008" y="210" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">太阳方向</text>
<text x="743" y="310" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="middle">朔望月平均约 29.53 天</text>
<text x="600" y="386" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">12 个朔望月约 354 天，比太阳年短约 11 天。</text>
<text x="600" y="464" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">阴阳合历通过置闰协调季节与月相；不同历法规则各异。</text>
