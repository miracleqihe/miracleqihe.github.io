<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">有机磷暴露：可观察到哪些变化</title>
<desc id="desc">不同人和暴露途径的表现可有差异</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">有机磷暴露：可观察到哪些变化</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">不同人和暴露途径的表现可有差异</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<g transform="translate(320 90) scale(1.25)"><circle cx="0" cy="0" r="29" fill="#e8d5cc" stroke="#b5968a" stroke-width="3"/><path d="M -34 40 Q 0 29 34 40 L 43 132 L 28 153 L 22 267 L 5 267 L 0 158 L -5 267 L -22 267 L -28 153 L -43 132 Z" fill="#e8d5cc" stroke="#b5968a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M -34 48 L -69 145 M 34 48 L 69 145" fill="none" stroke="#b5968a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="310" cy="83" r="7" fill="#4d6463" stroke="none" stroke-width="3"/><circle cx="330" cy="83" r="7" fill="#4d6463" stroke="none" stroke-width="3"/><path d="M352 97.0 Q339.0 113.0 342 120.0 Q352 131.0 362 120.0 Q365.0 113.0 352 97.0 Z" fill="#608994" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 188 Q295 165 308 186 M332 186 Q347 165 362 188" fill="none" stroke="#a66b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 285 q35-22 70 0 q-35 29-70 0" fill="none" stroke="#9a7554" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M225 285 l-16 13 m183-13 16 13" fill="none" stroke="#a66b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="81" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="240" y="89" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="405" cy="115" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="405" y="123" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="420" cy="200" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="420" y="208" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text><circle cx="433" cy="292" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="433" y="300" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">4</text><line x1="258" y1="81" x2="295" y2="83" stroke="#608994" stroke-width="4" stroke-linecap="round"/><line x1="387" y1="115" x2="354" y2="115" stroke="#608994" stroke-width="4" stroke-linecap="round"/><line x1="402" y1="200" x2="365" y2="190" stroke="#608994" stroke-width="4" stroke-linecap="round"/><line x1="415" y1="292" x2="360" y2="285" stroke="#608994" stroke-width="4" stroke-linecap="round"/><text x="510" y="100" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">瞳孔、流泪</text><text x="510" y="165" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">流涎、出汗</text><text x="510" y="230" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">气道分泌物、呼吸</text><text x="510" y="295" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">腹部和肌肉表现</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 眼部</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可有流泪、视物不清或瞳孔缩小。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 分泌</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可能流涎、出汗和流鼻涕。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 呼吸</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">咳嗽、气道分泌增加或呼吸困难是危</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">险表现。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 肌肉和腹部</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可出现呕吐、腹泻、抽动或乏力。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">先离开危险环境并呼叫急救，告知可能污染；不要贸然进入缺乏防护的空间。</text>
</g></svg>