<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">影像尺度：目标和参照物所在平面</title>
<desc id="desc">同样大小的目标因距离和拍摄角度不同，图上尺寸可能变化</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">影像尺度：目标和参照物所在平面</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">同样大小的目标因距离和拍摄角度不同，图上尺寸可能变化</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<rect x="95" y="220" width="105" height="75" rx="8" fill="#dce9e6" stroke="#72938e" stroke-width="3"/><circle cx="146" cy="258" r="23" fill="#fffdf8" stroke="#72938e" stroke-width="3"/><path d="M200 235 L580 140 M200 278 L580 410" fill="none" stroke="#a9bab5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="364" y1="175" x2="364" y2="400" stroke="#a66b70" stroke-width="9" stroke-linecap="round"/><line x1="570" y1="175" x2="570" y2="400" stroke="#5c826e" stroke-width="9" stroke-linecap="round"/><text x="364" y="449" font-size="26" font-weight="700" fill="#263d43" text-anchor="middle">较近</text><text x="570" y="449" font-size="26" font-weight="700" fill="#263d43" text-anchor="middle">较远</text><text x="145" y="338" font-size="26" font-weight="400" fill="#263d43" text-anchor="middle">相机</text><rect x="700" y="155" width="84" height="255" rx="8" fill="#fffdf8" stroke="#a0b4ad" stroke-width="3"/><line x1="721" y1="190" x2="721" y2="373" stroke="#a66b70" stroke-width="8" stroke-linecap="round"/><line x1="761" y1="240" x2="761" y2="346" stroke="#5c826e" stroke-width="8" stroke-linecap="round"/><text x="742" y="459" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">画面示意</text><text x="456" y="510" font-size="25" font-weight="400" fill="#5b6d70" text-anchor="middle">等高目标在不同距离可显得大小不同</text><circle cx="285" cy="178" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="285" y="186" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="500" cy="205" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="500" y="213" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="795" cy="126" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="795" y="134" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 较近目标</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">离相机较近时，在画面中可能显得更</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">大。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 较远目标</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">较远物体的像素尺寸不能直接套用近</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">处比例。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 测量条件</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">比例尺与目标同平面、镜头朝向及畸</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">变都要考虑。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 保存</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">保留原始照片、相机信息与处理步</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">骤。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">一张图片中远处门的尺寸不能直接换算近处人物的身高。</text>
</g></svg>