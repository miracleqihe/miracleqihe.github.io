<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">手机定位：点、范围与时间</title>
<desc id="desc">两个圆只是示意，不代表实际位置或精确概率</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">手机定位：点、范围与时间</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">两个圆只是示意，不代表实际位置或精确概率</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<rect x="105" y="67" width="610" height="440" rx="3" fill="#f1f5ee" stroke="#bbcbbf" stroke-width="5"/><path d="M105 190 h610 M105 310 h610 M260 67 v440 M510 67 v440" fill="none" stroke="#d9dfd0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="245" r="117" fill="#d3e5e2" stroke="#80a6a1" stroke-width="4"/><circle cx="425" cy="282" r="143" fill="#e8efdf" stroke="#a3b893" stroke-width="4"/><circle cx="340" cy="245" r="8" fill="#608994" stroke="none" stroke-width="3"/><circle cx="425" cy="282" r="8" fill="#5c826e" stroke="none" stroke-width="3"/><text x="320" y="100" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">地点估计 A</text><text x="451" y="463" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">地点估计 B</text><path d="M578 176 h55 v75 h-55z" fill="#cfc4b7" stroke="#9d8f82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="605" y="292" font-size="24" font-weight="400" fill="#263d43" text-anchor="middle">建筑</text><circle cx="215" cy="150" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="215" y="158" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="555" cy="346" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="555" y="354" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="650" cy="145" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="650" y="153" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 定位点</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">地图点是依据接收信号等数据计算出</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">的估计。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 范围</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">范围圈表达不确定性；不同应用的含</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">义可能不同。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 环境</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">建筑、遮挡和反射可能使定位漂移或</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">变差。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 时间</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">查看现在位置还是上次更新，并核对</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">设备记录。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">圈的重叠或中心点之间的线，不能单独证明路径、楼层或同行。</text>
</g></svg>