<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">昆虫发育：从卵到成虫</title>
<desc id="desc">不同昆虫及温度下的发育速度并不相同</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">昆虫发育：从卵到成虫</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">不同昆虫及温度下的发育速度并不相同</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<ellipse cx="110" cy="250" rx="24" ry="37" fill="#f6ead7" stroke="#bea888" stroke-width="3"/><ellipse cx="137" cy="250" rx="24" ry="37" fill="#f6ead7" stroke="#bea888" stroke-width="3"/><ellipse cx="164" cy="250" rx="24" ry="37" fill="#f6ead7" stroke="#bea888" stroke-width="3"/><line x1="200" y1="250" x2="260" y2="250" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 246.7 256.9 L 260 250 L 246.7 243.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 250 q45-48 90 0 q-45 48-90 0Z" fill="#ead9bd" stroke="#ad997d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M302 233 q4 17 0 34 M320 226 q4 24 0 48 M338 226 q4 24 0 48 M356 233 q4 17 0 34" fill="none" stroke="#ad997d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="390" y1="250" x2="450" y2="250" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 436.7 256.9 L 450 250 L 436.7 243.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="495" cy="250" rx="35" ry="55" fill="#c5a37c" stroke="#967653" stroke-width="4"/><path d="M474 235 h42 M470 250 h50 M474 265 h42" fill="none" stroke="#967653" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="540" y1="250" x2="600" y2="250" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 586.7 256.9 L 600 250 L 586.7 243.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="656" cy="250" rx="27" ry="37" fill="#657d75" stroke="#465e57" stroke-width="3"/><ellipse cx="633" cy="214" rx="33" ry="16" fill="#dce9e2" stroke="#93a99f" stroke-width="3"/><ellipse cx="680" cy="214" rx="33" ry="16" fill="#dce9e2" stroke="#93a99f" stroke-width="3"/><path d="M636 280 l-25 22 M648 284 l-13 28 M674 280 l25 22" fill="none" stroke="#657d75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="137" y="351" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">卵</text><text x="330" y="351" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">幼虫</text><text x="495" y="351" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">蛹</text><text x="656" y="351" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">成虫</text><text x="392" y="457" font-size="25" font-weight="400" fill="#5b6d70" text-anchor="middle">温度、种类、接近障碍都会影响发育</text><circle cx="124" cy="151" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="124" y="159" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="330" cy="151" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="330" y="159" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="495" cy="151" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="495" y="159" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text><circle cx="656" cy="151" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="656" y="159" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">4</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 卵</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可见成堆细小卵粒；记录部位与遮</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">挡。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 幼虫</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">幼虫取食并生长；不同大小可能对应</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">不同阶段。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 蛹</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">幼虫离开食源后可化蛹，附近位置也</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">需记录。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 成虫与解释</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">种类、温度、包裹、门窗和昆虫抵达</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">时间影响估计。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">昆虫发育时间与死亡时刻之间可能存在延迟或其他差异，不能直接等同。</text>
</g></svg>