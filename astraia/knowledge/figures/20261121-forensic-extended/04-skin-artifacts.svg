<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">浅表皮肤改变：先记录位置与环境</title>
<desc id="desc">同样的浅表缺损可能来自不同过程</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">浅表皮肤改变：先记录位置与环境</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">同样的浅表缺损可能来自不同过程</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<path d="M 103 285 Q 240 189 430 225 L 651 253 Q 690 263 701 302 Q 680 342 636 339 L 425 318 Q 242 350 105 319 Z" fill="#e8d5cc" stroke="#b5968a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 180 285 l19-14 20 16 20-10 21 19 21-9 17 14" fill="none" stroke="#a66b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 415 257 q18 11 30-2 q13-11 26 4 q10 12 24-1" fill="none" stroke="#9a7554" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 542 294 q10-7 15 3 q6-11 13-1 q7-7 13 4" fill="none" stroke="#a66b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="234" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="205" y="242" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="450" cy="215" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="450" y="223" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="575" cy="252" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="575" y="260" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text><text x="144" y="384" font-size="25" font-weight="400" fill="#263d43" text-anchor="start">擦伤样区域</text><text x="384" y="384" font-size="25" font-weight="400" fill="#263d43" text-anchor="start">干燥区域</text><text x="535" y="384" font-size="25" font-weight="400" fill="#263d43" text-anchor="start">浅表不规则缺损</text><text x="235" y="484" font-size="27" font-weight="400" fill="#5b6d70" text-anchor="start">示意：分布、位置和现场环境一起记录</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 擦伤</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">常见表皮受摩擦破损；需结合部位与</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">其他损伤。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 干燥</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">暴露部位可变深、干硬，接触与湿度</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">改变外观。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 昆虫活动</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">蚁类可形成不规则浅表缺损，也可能</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">看似出血。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 现场</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">保留分布、衣物及昆虫记录，组织变</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">化需专业比较。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">这些外观不能单独证明生前受伤，也不要为验证而擦拭或移动。</text>
</g></svg>