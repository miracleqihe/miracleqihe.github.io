<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">甲醇暴露：代谢物与延迟表现</title>
<desc id="desc">图示主要代谢方向，症状和速度因情况而异</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">甲醇暴露：代谢物与延迟表现</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">图示主要代谢方向，症状和速度因情况而异</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<circle cx="125" cy="255" r="55" fill="#edf2ed" stroke="#5c826e" stroke-width="4"/><text x="125" y="264" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">甲醇</text><line x1="183" y1="255" x2="260" y2="255" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 246.7 261.9 L 260 255 L 246.7 248.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M310 200 Q360 180 397 210 Q425 240 405 278 Q370 310 310 285 Q275 260 310 200Z" fill="#dfb5aa" stroke="#ac847b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="354" y="255" font-size="25" font-weight="700" fill="#263d43" text-anchor="middle">代谢</text><line x1="420" y1="255" x2="493" y2="255" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 479.7 261.9 L 493 255 L 479.7 248.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="558" cy="255" r="58" fill="#f7eee1" stroke="#9a7554" stroke-width="4"/><text x="558" y="246" font-size="26" font-weight="700" fill="#263d43" text-anchor="middle">甲酸等</text><text x="558" y="279" font-size="24" font-weight="400" fill="#263d43" text-anchor="middle">代谢物</text><line x1="600" y1="216" x2="695" y2="145" stroke="#a66b70" stroke-width="4" stroke-linecap="round"/><path d="M 688.5 158.5 L 695 145 L 680.2 147.4" fill="none" stroke="#a66b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="610" y1="288" x2="695" y2="360" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 680.4 356.7 L 695 360 L 689.3 346.1" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 695 132 Q 746 87 800 132 Q 746 177 695 132Z" fill="#fffdf9" stroke="#8ca39b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="746" cy="132" r="19" fill="#85a099" stroke="none" stroke-width="3"/><text x="745" y="205" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">视觉</text><path d="M746 304.0 Q707.0 352.0 716 373.0 Q746 406.0 776 373.0 Q785.0 352.0 746 304.0 Z" fill="#a66b70" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><text x="745" y="433" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">酸中毒</text><circle cx="54" cy="174" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="54" y="182" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="353" cy="151" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="353" y="159" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="630" cy="125" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="630" y="133" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text><circle cx="630" cy="414" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="630" y="422" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">4</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 初期</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可能有头痛、恶心、腹痛或困倦，早</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">期也可能不明显。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 代谢</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">甲醇经代谢产生甲醛和甲酸等物质。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 视觉</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">视物模糊、怕光或视力损害可能出</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">现。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 酸碱</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">代谢性酸中毒及意识、呼吸异常需要</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">紧急治疗。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">怀疑接触即呼叫急救，不等待视力改变，也不要催吐或自行饮酒处理。</text>
</g></svg>