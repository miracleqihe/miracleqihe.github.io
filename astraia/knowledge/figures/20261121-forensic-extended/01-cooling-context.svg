<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">尸温变化：记录身体周围的热交换</title>
<desc id="desc">从覆盖、接触面到空气与光照，均可能影响温度变化</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">尸温变化：记录身体周围的热交换</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">从覆盖、接触面到空气与光照，均可能影响温度变化</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<rect x="120" y="388" width="590" height="26" rx="2" fill="#b8a18b" stroke="#947c67" stroke-width="2"/><line x1="145" y1="414" x2="145" y2="490" stroke="#9a7554" stroke-width="7" stroke-linecap="round"/><line x1="685" y1="414" x2="685" y2="490" stroke="#9a7554" stroke-width="7" stroke-linecap="round"/><circle cx="180" cy="347" r="31" fill="#e8d5cc" stroke="#b5968a" stroke-width="3"/><path d="M 214 347 Q 305 301 420 326 L 590 349 L 620 382 L 217 382 Z" fill="#a8c0b2" stroke="#819f90" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 305 304 L 405 275 L 447 318" fill="none" stroke="#608994" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="265" font-size="27" font-weight="400" fill="#263d43" text-anchor="start">覆盖物</text><line x1="545" y1="301" x2="545" y2="220" stroke="#608994" stroke-width="4" stroke-linecap="round"/><path d="M 551.9 233.3 L 545 220 L 538.1 233.3" fill="none" stroke="#608994" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="205" font-size="27" font-weight="400" fill="#263d43" text-anchor="start">空气流动</text><line x1="365" y1="420" x2="365" y2="475" stroke="#a66b70" stroke-width="4" stroke-linecap="round"/><path d="M 358.1 461.7 L 365 475 L 371.9 461.7" fill="none" stroke="#a66b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="518" font-size="27" font-weight="400" fill="#263d43" text-anchor="start">身体与接触面</text><circle cx="685" cy="116" r="36" fill="#f6d794" stroke="#c99d54" stroke-width="3"/><path d="M 685 59 v-19 M 685 192 v19 M 628 116 h-19 M 742 116 h19 M 645 76 l-14-14 M 725 76 l14-14" fill="none" stroke="#9a7554" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="230" font-size="26" font-weight="400" fill="#263d43" text-anchor="start">光照</text><circle cx="258" cy="310" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="258" y="318" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="500" cy="284" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="500" y="292" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="325" cy="443" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="325" y="451" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text><circle cx="745" cy="165" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="745" y="173" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">4</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 覆盖</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">衣被和衣物影响散热；湿衣物与干衣</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">物的作用可能不同。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 空气</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">室温、风、空调或暖气会改变热交换</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">条件。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 接触</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">地面、床垫或水的温度与接触面积都</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">需记录。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 光照</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">阳光直射与遮挡会使局部受热条件不</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">同。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">现场温度与覆盖情况会随时间变化；一次测温不能确定死亡时刻。</text>
</g></svg>