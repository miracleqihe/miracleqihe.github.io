<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">眼部干燥：暴露区域与眼睑遮挡</title>
<desc id="desc">局部示意，阴影只表示可能暴露的位置</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">眼部干燥：暴露区域与眼睑遮挡</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">局部示意，阴影只表示可能暴露的位置</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<path d="M 125 275 Q 390 30 655 275 Q 390 520 125 275 Z" fill="#fffdf9" stroke="#9f8580" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 125 275 Q 390 30 655 275" fill="none" stroke="#b59387" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M 125 275 Q 390 520 655 275" fill="none" stroke="#b59387" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="390" cy="275" r="96" fill="#b8c9c0" stroke="#6a8b80" stroke-width="4"/><circle cx="390" cy="275" r="42" fill="#536b68" stroke="none" stroke-width="3"/><path d="M 180 277 Q 240 250 292 286 Q 256 334 192 311 Z" fill="#bfa08a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><path d="M 488 286 Q 540 250 600 277 L 588 311 Q 524 334 488 286 Z" fill="#bfa08a" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><line x1="390" y1="171" x2="390" y2="122" stroke="#608994" stroke-width="3" stroke-linecap="round"/><text x="390" y="99" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">角膜及虹膜区域</text><line x1="239" y1="299" x2="145" y2="355" stroke="#9a7554" stroke-width="3" stroke-linecap="round"/><text x="62" y="388" font-size="25" font-weight="400" fill="#263d43" text-anchor="start">暴露眼白</text><text x="63" y="424" font-size="25" font-weight="400" fill="#263d43" text-anchor="start">可见干燥斑</text><circle cx="167" cy="335" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="167" y="343" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="432" cy="164" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="432" y="172" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="613" cy="338" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="613" y="346" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 暴露眼白</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">眼睑间暴露的巩膜有时出现黄褐至深</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">褐干燥斑。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 角膜</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">透明角膜可能逐渐失去光泽、变得混</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">浊。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 遮挡</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">眼睑闭合程度、覆盖、湿度及气流改</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">变干燥条件。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 记录</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">记录眼睑开合和周围环境，不仅凭外</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">观判断时间。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">眼部外观受多种因素影响；遇到无反应者应立即按急救指引处理。</text>
</g></svg>