<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">阿片类过量：意识与呼吸先看什么</title>
<desc id="desc">呼吸抑制可能迅速危及生命</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">阿片类过量：意识与呼吸先看什么</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">呼吸抑制可能迅速危及生命</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<circle cx="230" cy="148" r="66" fill="#e8d5cc" stroke="#b5968a" stroke-width="4"/><path d="M180 121 Q230 45 280 121" fill="none" stroke="#a7827a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 230 214 V 320" fill="none" stroke="#608994" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 320 Q175 310 160 368 Q150 424 192 450 Q225 460 230 426 M230 320 Q285 310 300 368 Q310 424 268 450 Q235 460 230 426" fill="#e7cac5" stroke="#ad8987" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M430 108 h260 v106 h-260z" fill="#e8f0ee" stroke="#9cb5ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="153" font-size="27" font-weight="700" fill="#263d43" text-anchor="middle">呼唤、轻拍</text><text x="560" y="187" font-size="27" font-weight="400" fill="#263d43" text-anchor="middle">仍无反应</text><path d="M430 260 h260 v116 h-260z" fill="#f6e8e4" stroke="#bf9a91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="306" font-size="27" font-weight="700" fill="#263d43" text-anchor="middle">呼吸缓慢、浅</text><text x="560" y="342" font-size="27" font-weight="400" fill="#263d43" text-anchor="middle">或仅喘息</text><line x1="315" y1="355" x2="410" y2="320" stroke="#a66b70" stroke-width="4" stroke-linecap="round"/><path d="M 399.9 331.1 L 410 320 L 395.1 318.1" fill="none" stroke="#a66b70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="735" y="246" width="72" height="128" rx="12" fill="#fffdf8" stroke="#8ca39b" stroke-width="4"/><line x1="755" y1="265" x2="787" y2="265" stroke="#8ca39b" stroke-width="3" stroke-linecap="round"/><line x1="761" y1="357" x2="781" y2="357" stroke="#8ca39b" stroke-width="3" stroke-linecap="round"/><text x="772" y="417" font-size="23" font-weight="400" fill="#263d43" text-anchor="middle">呼救</text><circle cx="118" cy="147" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="118" y="155" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="118" cy="365" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="118" y="373" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="831" cy="251" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="831" y="259" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 意识</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">呼唤、轻拍仍叫不醒，或反应明显迟</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">钝。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 呼吸</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">缓慢、浅、不规则，仅喘息或出现鼾</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">鸣、咕噜声。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 立即呼救</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">呼叫急救；有纳洛酮时依包装或调度</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">指导使用。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 持续观察</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">无正常呼吸按调度指导复苏，不因等</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">药而耽误。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">瞳孔或嘴唇颜色并非总会改变；即使症状改善也要等待专业救援。</text>
</g></svg>