<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">DNA 混合图谱：共享特征与重叠峰</title>
<desc id="desc">只演示一个位点；数字和峰形均为教学例子</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">DNA 混合图谱：共享特征与重叠峰</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">只演示一个位点；数字和峰形均为教学例子</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<text x="100" y="67" font-size="27" font-weight="700" fill="#263d43" text-anchor="start">教学示例：一个位点</text><line x1="110" y1="165" x2="720" y2="165" stroke="#8eaaa9" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="295" x2="720" y2="295" stroke="#8eaaa9" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="425" x2="720" y2="425" stroke="#8eaaa9" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="120" x2="230" y2="438" stroke="#d3ded9" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8"/><line x1="405" y1="120" x2="405" y2="438" stroke="#d3ded9" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8"/><line x1="580" y1="120" x2="580" y2="438" stroke="#d3ded9" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 8"/><path d="M 199 165 L 230 113 L 261 165" fill="none" stroke="#5c826e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 374 165 L 405 113 L 436 165" fill="none" stroke="#5c826e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 374 295 L 405 243 L 436 295" fill="none" stroke="#608994" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 549 295 L 580 243 L 611 295" fill="none" stroke="#608994" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 199 425 L 230 375 L 261 425" fill="none" stroke="#a66b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 374 425 L 405 338 L 436 425" fill="none" stroke="#a66b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 549 425 L 580 375 L 611 425" fill="none" stroke="#a66b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="109" y="174" font-size="25" font-weight="700" fill="#263d43" text-anchor="end">甲</text><text x="109" y="304" font-size="25" font-weight="700" fill="#263d43" text-anchor="end">乙</text><text x="109" y="434" font-size="25" font-weight="700" fill="#263d43" text-anchor="end">混合</text><text x="230" y="485" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">11</text><text x="405" y="485" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">13</text><text x="580" y="485" font-size="25" font-weight="400" fill="#263d43" text-anchor="middle">15</text><text x="405" y="529" font-size="24" font-weight="400" fill="#5b6d70" text-anchor="middle">共享特征可能合在一个峰</text><circle cx="38" cy="165" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="38" y="173" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="38" cy="295" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="38" y="303" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="38" cy="425" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="38" y="433" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 甲的特征</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">示例中甲在该位点有 11 和 13。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 乙的特征</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">示例中乙为 13 和 15，共享 13。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 混合结果</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">三个可见峰不等于三个人；共享特征</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">可能重叠。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 其他因素</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">低量、降解及技术噪声也影响哪些峰</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">能够看见。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">峰高不能直接换算接触先后、接触时间或某人是否实施特定行为。</text>
</g></svg>