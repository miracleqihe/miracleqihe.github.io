<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">时间线：记录事件与未知区间</title>
<desc id="desc">例子中的时间均为虚构，来源和事件类型需要分别记录</desc>
<rect x="1" y="1" width="1598" height="818" rx="15" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="36" y="53" font-size="42" font-weight="700" fill="#263d43" text-anchor="start">时间线：记录事件与未知区间</text>
<text x="38" y="94" font-size="29" font-weight="400" fill="#5b6d70" text-anchor="start">例子中的时间均为虚构，来源和事件类型需要分别记录</text>
<rect x="28" y="120" width="920" height="595" rx="12" fill="#f3f6f2" stroke="#dce6df" stroke-width="2"/>
<g transform="translate(35 130)">
<line x1="110" y1="290" x2="740" y2="290" stroke="#759b99" stroke-width="6" stroke-linecap="round"/><circle cx="180" cy="290" r="11" fill="#5c826e" stroke="none" stroke-width="3"/><circle cx="430" cy="290" r="11" fill="#608994" stroke="none" stroke-width="3"/><circle cx="660" cy="290" r="11" fill="#a66b70" stroke="none" stroke-width="3"/><text x="180" y="242" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">08:00</text><text x="430" y="242" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">08:12</text><text x="660" y="242" font-size="28" font-weight="700" fill="#263d43" text-anchor="middle">08:19</text><text x="180" y="342" font-size="24" font-weight="400" fill="#263d43" text-anchor="middle">最后一次确认</text><text x="430" y="342" font-size="24" font-weight="400" fill="#263d43" text-anchor="middle">门禁记录</text><text x="660" y="342" font-size="24" font-weight="400" fill="#263d43" text-anchor="middle">后来发现</text><path d="M180 400 v25 h480 v-25" fill="none" stroke="#9a7554" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="473" font-size="26" font-weight="400" fill="#263d43" text-anchor="middle">相关事件可能处于区间中</text><text x="420" y="514" font-size="23" font-weight="400" fill="#5b6d70" text-anchor="middle">时间均为虚构示例</text><circle cx="180" cy="194" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="180" y="202" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">1</text><circle cx="430" cy="194" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="430" y="202" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">2</text><circle cx="660" cy="194" r="18" fill="#fffdf8" stroke="#9a7554" stroke-width="3"/><text x="660" y="202" font-size="23" font-weight="700" fill="#9a7554" text-anchor="middle">3</text>
</g>
<line x1="971" y1="132" x2="971" y2="706" stroke="#e3e8e2" stroke-width="2" stroke-linecap="round"/>
<text x="1005" y="164" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">① 最后确认</text>
<text x="1005" y="204" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">记录的是最后一次被确认的时间，并</text>
<text x="1005" y="241" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">非事件发生时间。</text>
<text x="1005" y="299" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">② 门禁记录</text>
<text x="1005" y="339" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">刷卡或授权只记录系统事件，未必证</text>
<text x="1005" y="376" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">明某人进入。</text>
<text x="1005" y="434" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">③ 后来发现</text>
<text x="1005" y="474" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">记录发现者及发现时间；中间可能有</text>
<text x="1005" y="511" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">未知区间。</text>
<text x="1005" y="569" font-size="34" font-weight="700" fill="#263d43" text-anchor="start">④ 校准</text>
<text x="1005" y="609" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">核对设备时钟、时区、记录延迟和来</text>
<text x="1005" y="646" font-size="31" font-weight="400" fill="#263d43" text-anchor="start">源。</text>
<rect x="28" y="735" width="1544" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="45" y="773" font-size="29" font-weight="400" fill="#785334" text-anchor="start">先保留原始时间与证据来源，再标记推断和尚不能确定的范围。</text>
</g></svg>