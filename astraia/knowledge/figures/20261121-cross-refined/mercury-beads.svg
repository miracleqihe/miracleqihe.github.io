<text x="600" y="479" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">若进入地毯、裂缝或污染范围不明，请寻求专业指导。</text>
