<path d="M 286.5 299.0 L 275 305 L 286.5 311.0" fill="none" stroke="#bb8737" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="330" y="225" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">请求</text>
<text x="330" y="337" fill="#bb8737" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">结果</text>
<line x1="625" y1="230" x2="835" y2="165" stroke="#326f80" stroke-width="3"/>
<path d="M 825.8 174.1 L 835 165 L 822.2 162.7" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="735" y="184.5" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text>
<line x1="625" y1="270" x2="835" y2="275" stroke="#326f80" stroke-width="3"/>
<path d="M 823.3 280.7 L 835 275 L 823.6 268.7" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="735" y="259.5" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text>
<line x1="625" y1="310" x2="835" y2="385" stroke="#326f80" stroke-width="3"/>
<path d="M 822.1 386.8 L 835 385 L 826.2 375.5" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="735" y="334.5" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text>
<text x="600" y="477" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">解析器可按 TTL 缓存结果；根与顶级域信息也可能已被缓存。</text>
</svg>