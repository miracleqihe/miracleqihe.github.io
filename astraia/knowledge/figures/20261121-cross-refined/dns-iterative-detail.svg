<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">域名查询：递归解析器、委派与缓存</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">以一个缓存未命中的简化查询为例，实际过程可因缓存和配置变化。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<rect x="75" y="210" width="195" height="125" rx="8" fill="#eaf1ed" stroke="#60816a" stroke-width="3"/>
<text x="172" y="260" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">用户设备</text>
<text x="172" y="300" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">请求域名</text>
<rect x="395" y="210" width="225" height="125" rx="8" fill="#f5ece0" stroke="#bb8737" stroke-width="3"/>
<text x="508" y="260" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">递归解析器</text>
<text x="508" y="300" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">查询或读取缓存</text>
<rect x="850" y="125" width="250" height="80" rx="8" fill="#fff" stroke="#a8bbb2" stroke-width="2"/>
<text x="975" y="156" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">根服务器</text>
<text x="975" y="186" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">指向顶级域</text>
<rect x="850" y="235" width="250" height="80" rx="8" fill="#fff" stroke="#a8bbb2" stroke-width="2"/>
<text x="975" y="266" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">顶级域服务器</text>
<text x="975" y="296" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">指向权威服务器</text>
<rect x="850" y="345" width="250" height="80" rx="8" fill="#fff" stroke="#a8bbb2" stroke-width="2"/>
<text x="975" y="376" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">权威服务器</text>
<text x="975" y="406" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">返回相应记录</text>
<line x1="275" y1="240" x2="390" y2="240" stroke="#326f80" stroke-width="4"/>
<path d="M 378.5 246.0 L 390 240 L 378.5 234.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
