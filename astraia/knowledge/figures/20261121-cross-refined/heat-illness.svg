<circle cx="275" cy="245" r="9" fill="#b4dce0" stroke="#326f80" stroke-width="2"/>
<circle cx="230" cy="370" r="9" fill="#b4dce0" stroke="#326f80" stroke-width="2"/>
<circle cx="260" cy="370" r="9" fill="#b4dce0" stroke="#326f80" stroke-width="2"/>
