<text x="470" y="192" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">转移到阴凉处</text>
<line x1="350" y1="260" x2="447" y2="260" stroke="#326f80" stroke-width="4"/>
<path d="M 435.5 266.0 L 447 260 L 435.5 254.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="470" y="267" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">湿敷皮肤并扇风降温</text>
<line x1="350" y1="335" x2="447" y2="335" stroke="#a94d37" stroke-width="4"/>
<path d="M 435.5 341.0 L 447 335 L 435.5 329.0" fill="none" stroke="#a94d37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
