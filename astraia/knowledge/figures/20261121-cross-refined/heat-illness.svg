<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">高温中的危险信号：意识变化与主动降温</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">身体发热、头晕、乏力可出现于多种热相关疾病；意识异常应立即急救。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
