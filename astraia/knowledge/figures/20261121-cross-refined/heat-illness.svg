<text x="600" y="474" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">意识不清者不要喂水；皮肤可以干燥，也可以仍在出汗。</text>
