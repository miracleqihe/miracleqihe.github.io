<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">部分肝毒性野菌：症状可以延迟出现</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">此图仅说明部分鹅膏毒素中毒的可能过程，个体和菌种差异很大。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<line x1="100" y1="255" x2="1110" y2="255" stroke="#326f80" stroke-width="4"/>
<path d="M 1098.5 261.0 L 1110 255 L 1098.5 249.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="180" cy="255" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<circle cx="440" cy="255" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<circle cx="710" cy="255" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<circle cx="990" cy="255" r="9" fill="#326f80" stroke="#326f80" stroke-width="2"/>
<text x="180" y="192" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">误食野菌</text>
<text x="440" y="192" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">延迟胃肠症状</text>
<text x="710" y="192" fill="#bb8737" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">症状可能暂缓</text>
<text x="990" y="192" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="middle">肝肾损伤</text>
<text x="180" y="319" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">保留剩余物</text>
<text x="440" y="319" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">腹痛、呕吐、腹泻</text>
<text x="710" y="319" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">不能据此认为恢复</text>
<text x="990" y="319" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">需医院检查和治疗</text>
<text x="600" y="425" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">怀疑误食毒菌，立即联系中毒咨询或就医，不等出现症状。</text>
<text x="600" y="482" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">图不用于估算个人病程；不要催吐或用偏方处理。</text>
</svg>