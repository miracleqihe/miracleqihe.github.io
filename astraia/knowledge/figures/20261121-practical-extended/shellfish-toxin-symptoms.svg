<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">麻痹性贝类中毒：留意麻木与呼吸</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">食用受毒素污染的贝类后可能出现神经症状，症状和发生时间各有差异。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<circle cx="235" cy="190" r="60" fill="#f0ddce" stroke="#263b3e" stroke-width="3"/>
<circle cx="210" cy="187" r="4" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<circle cx="260" cy="187" r="4" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<path d="M 211 218 Q 235 229 259 218" fill="none" stroke="#a94d37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 185 260 L 135 350 M 285 260 L 335 350 M 185 260 Q 235 240 285 260 L 292 365 L 178 365 Z" fill="#e3eee7" stroke="#60816a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="135" cy="350" r="7" fill="#a94d37" stroke="#a94d37" stroke-width="1"/>
<circle cx="335" cy="350" r="7" fill="#a94d37" stroke="#a94d37" stroke-width="1"/>
<circle cx="220" cy="220" r="7" fill="#a94d37" stroke="#a94d37" stroke-width="1"/>
<circle cx="250" cy="220" r="7" fill="#a94d37" stroke="#a94d37" stroke-width="1"/>
<line x1="355" y1="190" x2="450" y2="190" stroke="#326f80" stroke-width="3"/>
<path d="M 438.5 196.0 L 450 190 L 438.5 184.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="480" y="198" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">口唇、舌或面部麻刺</text>
<line x1="355" y1="260" x2="450" y2="260" stroke="#326f80" stroke-width="3"/>
<path d="M 438.5 266.0 L 450 260 L 438.5 254.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="480" y="268" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="start">手脚麻木、动作不稳</text>
<line x1="355" y1="330" x2="450" y2="330" stroke="#a94d37" stroke-width="3"/>
<path d="M 438.5 336.0 L 450 330 L 438.5 324.0" fill="none" stroke="#a94d37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="480" y="338" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">呼吸或吞咽困难：立即急救</text>
<text x="600" y="459" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">停止食用，保留剩余食物和同餐者信息；不要等待症状自行消退。</text>
</svg>