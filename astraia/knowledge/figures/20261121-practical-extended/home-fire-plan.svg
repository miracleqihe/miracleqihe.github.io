<line x1="330" y1="305" x2="490" y2="260" stroke="#326f80" stroke-width="5"/>
<path d="M 480.5 268.9 L 490 260 L 477.3 257.3" fill="none" stroke="#326f80" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="485" y1="260" x2="485" y2="150" stroke="#60816a" stroke-width="5"/>
<path d="M 491.0 161.5 L 485 150 L 479.0 161.5" fill="none" stroke="#60816a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
