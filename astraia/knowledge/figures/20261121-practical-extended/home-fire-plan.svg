<line x1="520" y1="125" x2="520" y2="230" stroke="#263b3e" stroke-width="5"/>
<line x1="520" y1="290" x2="520" y2="410" stroke="#263b3e" stroke-width="5"/>
<path d="M 645 260 Q 670 215 692 259 Q 715 220 725 264 Z" fill="#e1a77b" stroke="#a94d37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
