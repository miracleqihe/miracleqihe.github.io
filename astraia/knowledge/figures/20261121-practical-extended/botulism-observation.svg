<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">肉毒中毒：从眼部到呼吸的危险信号</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">食源性肉毒中毒可能先有消化道不适，也可能以神经症状为主。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<circle cx="260" cy="207" r="75" fill="#f0ddce" stroke="#263b3e" stroke-width="3"/>
<path d="M 220 196 L 247 206 M 273 206 L 300 196" fill="none" stroke="#263b3e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="235" cy="215" r="4" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<circle cx="285" cy="215" r="4" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<path d="M 235 250 Q 260 257 285 250" fill="none" stroke="#263b3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 202 290 Q 260 270 318 290 L 335 375 L 185 375 Z" fill="#dcebe5" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="360" y1="162" x2="460" y2="162" stroke="#326f80" stroke-width="3"/>
<path d="M 448.5 168.0 L 460 162 L 448.5 156.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="485" y="170" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">眼部</text>
<text x="610" y="170" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">重影、视物模糊、眼睑下垂</text>
<line x1="360" y1="237" x2="460" y2="237" stroke="#326f80" stroke-width="3"/>
<path d="M 448.5 243.0 L 460 237 L 448.5 231.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="485" y="245" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">口咽</text>
<text x="610" y="245" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">说话含糊、吞咽困难</text>
<line x1="360" y1="312" x2="460" y2="312" stroke="#326f80" stroke-width="3"/>
<path d="M 448.5 318.0 L 460 312 L 448.5 306.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="485" y="320" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start">呼吸</text>
<text x="610" y="320" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">肌无力加重、呼吸困难</text>
<text x="600" y="449" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">出现可疑症状立即急诊；医护会评估呼吸并尽早使用抗毒素。</text>
<text x="600" y="485" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">异常食品的味道或外观正常，也不能排除毒素。</text>
</svg>