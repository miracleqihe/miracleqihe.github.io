<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">一氧化碳：从燃烧到人体缺氧</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">一氧化碳无色无味；不能靠闻气味或看脸色排除。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<rect x="80" y="170" width="230" height="200" rx="8" fill="#f4f2ed" stroke="#b6c7bf" stroke-width="2"/>
<path d="M 120 306 Q 150 245 180 286 Q 205 234 235 306 Z" fill="#e8b477" stroke="#a94d37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="195" y="407" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">不完全燃烧</text>
<line x1="320" y1="260" x2="435" y2="260" stroke="#326f80" stroke-width="4"/>
<path d="M 423.5 266.0 L 435 260 L 423.5 254.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="377" y="238" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="middle">CO</text>
<circle cx="540" cy="260" r="79" fill="#e4a9a2" stroke="#a94d37" stroke-width="4"/>
<ellipse cx="540" cy="260" rx="35" ry="25" fill="#f6dbd5" stroke="#a94d37" stroke-width="3"/>
<text x="540" y="375" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">与血红蛋白结合</text>
<line x1="635" y1="260" x2="735" y2="260" stroke="#326f80" stroke-width="4"/>
<path d="M 723.5 266.0 L 735 260 L 723.5 254.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="820" cy="205" r="37" fill="#f0ddce" stroke="#263b3e" stroke-width="3"/>
<path d="M 778 250 Q 820 233 862 250 L 873 355 L 767 355 Z" fill="#e7efeb" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="820" y="407" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">头痛、头晕、乏力</text>
<text x="1050" y="202" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">报警或怀疑暴露</text>
<text x="1050" y="245" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">立即到室外</text>
<text x="1050" y="285" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="middle">呼叫急救</text>
<text x="1050" y="325" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">不要返回救人</text>
<text x="600" y="486" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">室内多人同时不适要提高警觉；救援交由有防护的人员。</text>
</svg>