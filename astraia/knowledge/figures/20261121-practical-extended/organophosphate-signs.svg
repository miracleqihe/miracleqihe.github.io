<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">疑似有机磷暴露：观察分泌物与呼吸</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">接触农药后出现多种异常，先离开污染环境并呼叫急救。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<circle cx="240" cy="190" r="68" fill="#f0ddce" stroke="#263b3e" stroke-width="3"/>
<circle cx="215" cy="185" r="3" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<circle cx="265" cy="185" r="3" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<path d="M 222 217 Q 240 228 258 217" fill="none" stroke="#263b3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 175 270 Q 240 245 305 270 L 318 375 L 162 375 Z" fill="#e4eee9" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 205 226 Q 200 244 205 252 Q 210 244 205 226 Z" fill="#9fcbd1" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="465" y="166" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">眼、鼻、口</text>
<text x="650" y="166" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">流泪、流涎或瞳孔变小</text>
<text x="465" y="230" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">皮肤与胃肠</text>
<text x="650" y="230" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">出汗、腹痛、呕吐或腹泻</text>
<text x="465" y="294" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="25" font-weight="700" text-anchor="start">呼吸与肌肉</text>
<text x="650" y="294" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">喘息、分泌物增多或无力</text>
<text x="465" y="368" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">先防止救助者接触污染物</text>
<text x="600" y="474" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">在安全条件下移除污染衣物、用水清洗皮肤，按急救人员指导处理。</text>
</svg>