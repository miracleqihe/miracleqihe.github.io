<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">体温记录：表面与深部位置</title>
<desc id="desc">身体不同部位受环境和组织条件的影响不同</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">体温记录：表面与深部位置</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">身体不同部位受环境和组织条件的影响不同</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(255 100) scale(1.12)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="230" cy="91" r="8" fill="#668f98" stroke="none" stroke-width="3"/><circle cx="267" cy="100" r="8" fill="#719481" stroke="none" stroke-width="3"/><circle cx="285" cy="210" r="8" fill="#a7835a" stroke="none" stroke-width="3"/><circle cx="260" cy="280" r="8" fill="#af7072" stroke="none" stroke-width="3"/><line x1="230" y1="91" x2="415" y2="100" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="230" cy="91" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="423" y="108" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">耳部</text><line x1="267" y1="100" x2="415" y2="180" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="267" cy="100" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="423" y="188" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">眼部</text><line x1="285" y1="210" x2="415" y2="260" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="285" cy="210" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="423" y="268" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">皮肤表面</text><line x1="260" y1="280" x2="415" y2="340" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="260" cy="280" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="423" y="348" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">深部体温</text><text x="255" y="455" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">部位符号只示意类别，非操