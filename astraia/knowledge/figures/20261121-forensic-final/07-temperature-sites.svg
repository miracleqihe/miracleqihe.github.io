<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">表面、耳部、眼部和深部的温度</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">变化速度不同。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">专业模型需要对应测量部位与环</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">境条件。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">记录仪器、时间、部位与保存条</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">件。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不同位置的读数不能直接互换或单独确定时刻。</text>
