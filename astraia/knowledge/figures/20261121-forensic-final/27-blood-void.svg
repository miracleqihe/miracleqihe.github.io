<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">血迹分布：空白区与周边痕迹</title>
<desc id="desc">图为虚构平面，标出空白位置及周围点状分布</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">血迹分布：空白区与周边痕迹</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">图为虚构平面，标出空白位置及周围点状分布</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<rect x="80" y="100" width="620" height="300" rx="3" fill="#f7f2e8" stroke="#c1b4a2" stroke-width="3"/><path d="M335 160 Q390 130 445 160 L455 310 Q390 335 325 310Z" fill="#f7f2e8" stroke="#cdbfb0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="145" r="8" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="170" cy="135" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="230" cy="170" r="7" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="285" cy="130" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="500" cy="140" r="9" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="560" cy="170" r="6" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="650" cy="145" r="8" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="150" cy="230" r="6" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="245" cy="250" r="9" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="300" cy="205" r="4" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="490" cy="220" r="7" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="570" cy="265" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="655" cy="220" r="8" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="120" cy="345" r="6" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="250" cy="350" r="9" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="495" cy="345" r="6" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="630" cy="330" r="7" fill="#af7072" stroke="none" stroke-width="3"/><line x1="385" y1="220" x2="475" y2="205" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="385" cy="220" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="483" y="213" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">局部空白区</text><line x1="230" y1="170" x2="85" y2="60" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="230" cy="170" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="93" y="68" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">周围点状分布</text><text x="385" y="445" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">遮挡、表面性质和后续改变都需评估</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">空白区可能与遮挡、表面性质或</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">后续变化有关。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">先记录整体、局部和可见边缘之</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">间的关系。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">分类和形成方向的解释需要验证</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">与比较。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">单一空白轮廓不能确认遮挡物或具体经过。</text>
</g></svg>