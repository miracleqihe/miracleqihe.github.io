<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">压缩气体膨胀时，肺组织可能受</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">损。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">气泡进入动脉后可影响脑或心脏</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">供血。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">上浮后意识改变或无力立即呼叫</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">急救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">按调度指导救助；供氧和转运由受训人员安排。</text>
</g></svg>