cy="95" r="42" fill="#e7d5cd" stroke="#b49b90" stroke-width="3"/><line x1="275" y1="135" x2="55" y2="95" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="275" cy="135" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="63" y="103" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肺泡</text><line x1="295" y1="311" x2="80" y2="420" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="295" cy="311" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="88" y="428" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">气体进入血管的可能路径</text><line x1="600" y1="95" x2="680" y2="95" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="600" cy="95" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="688" y="103" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">脑部供血</text><text x="650" y="340" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">心脏</text><text x="520" y="450" font-size="24" fill="#596b6d" font-weight="400" text-anchor="start">路径为机制示意</text>
