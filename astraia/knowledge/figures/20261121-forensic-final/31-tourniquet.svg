<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">四肢严重出血：止血带位置</title>
<desc id="desc">伤口、关节与近心端的相对位置</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">四肢严重出血：止血带位置</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">伤口、关节与近心端的相对位置</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<text x="380" y="58" font-size="27" fill="#293e44" font-weight="700" text-anchor="middle">伤口远离关节</text><path d="M80 105 Q145 90 220 105 L340 112 L550 110 Q650 105 710 130 L720 155 Q645 168 550 165 L340 165 L220 170 Q145 185 80 170Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="345" cy="138" rx="22" ry="36" fill="#e2cabd" stroke="#b49284" stroke-width="2"/><rect x="468" y="105" width="45" height="64" rx="3" fill="#af7072" stroke="#965f61" stroke-width="3"/><line x1="475" y1="100" x2="510" y2="100" stroke="#293e44" stroke-width="5" stroke-linecap="round"/><path d="M558 120 l-17 22 19 13 18-21Z" fill="#b86b70" stroke="#995f63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="556" y1="92" x2="489" y2="92" stroke="#a7835a" stroke-width="3" stroke-linecap="round"/><path d="M 500.4 85.8 L 489 92 L 500.4 98.2" fill="none" stroke="#a7835a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="82" font-size="24" fill="#293e44" font-weight="700" text-anchor="middle">2-3 英寸</text><line x1="560" y1="138" x2="640" y2="200" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="560" cy="138" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="648" y="208" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">伤口</text><line x1="490" y1="135" x2="425" y2="205" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="490" cy="135" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="433" y="213" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">止血带</text><line x1="300" y1="205" x2="120" y2="205" stroke="#668f98" stroke-width="4" stroke-linecap="round"/><path d="M 131.4 198.8 L 120 205 L 131.4 211.2" fill="none" stroke="#668f98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="205" y="240" font-size="23" fill="#293e44" font-weight="400" text-anchor="middle">朝躯干、心脏方向</text><text x="380" y="290" font-size="27" fill="#293e44" font-weight="700" text-anchor="middle">伤口靠近关节</text><path d="M80 325 Q145 310 220 325 L340 332 L550 330 Q650 325 710 350 L720 375 Q645 388 550 385 L340 385 L220 390 Q145 405 80 390Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="345" cy="358" rx="22" ry="36" fill="#e2cabd" stroke="#b49284" stroke-width="2"/><rect x="270" y="325" width="45" height="64" rx="3" fill="#af7072" stroke="#965f61" stroke-width="3"/><line x1="277" y1="320" x2="312" y2="320" stroke="#293e44" stroke-width="5" stroke-linecap="round"/><path d="M380 340 l-17 22 19 13 18-21Z" fill="#b86b70" stroke="#995f63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="345" y1="358" x2="420" y2="430" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="345" cy="358" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="428" y="438" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">关节</text><line x1="292" y1="355" x2="75" y2="455" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="292" cy="355" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="83" y="463" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">移至关节近心侧</text><text x="560" y="490" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">位置示意，比例不代表实际尺寸</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">用于危及生命的四肢外出血；呼</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">叫急救。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">放在伤口近心端 2-3 英寸，约 </text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">5-7.5 厘米处；避开关节。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">按设备说明拧紧至出血停止，固</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">定并记录时间。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">等待止血带时持续直接压迫；固定后不要自行松开。</text>
</g></svg>