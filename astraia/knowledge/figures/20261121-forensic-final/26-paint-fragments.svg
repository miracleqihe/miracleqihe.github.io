<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">比较信息。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不同来源也可能有相似的颜色和</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">层次。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">需要参照样本、方法与完整证据共同解释。</text>
