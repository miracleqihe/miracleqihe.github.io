roke-linecap="round"/><circle cx="200" cy="190" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="98" y="403" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">表层</text><line x1="200" y1="235" x2="275" y2="395" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="200" cy="235" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="283" y="403" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">底漆或其他层</text><line x1="555" y1="310" x2="600" y2="395" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="555" cy="310" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="608" y="403" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">基底</text><text x="410" y="465" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">层数、颜色、成分和断口均需比较</text>
