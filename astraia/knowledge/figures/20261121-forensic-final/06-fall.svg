<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">坠落伤：观察头、胸腹与四肢</title>
<desc id="desc">不同区域可能同时受伤，内部损伤不一定外露</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">坠落伤：观察头、胸腹与四肢</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">不同区域可能同时受伤，内部损伤不一定外露</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(255 95) scale(1.14)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M230 128 q25-20 50 0" fill="none" stroke="#af7072" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(255 185) scale(0.55)"><path d="M0 5 C-32 -17 -62 4 -70 43 Q-82 105 -21 108 L0 85 M0 5 C32 -17 62 4 70 43 Q82 105 21 108 L0 85" fill="#e4c5bf" stroke="#b68b83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -65 V43 M0 23 L-38 58 M0 23 L38 58" fill="none" stroke="#668f98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(255 220) scale(0.22)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M230 300 q25-18 50 0" fill="none" stroke="#a7835a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="292" cy="320" r="10" fill="#af7072" stroke="none" stroke-width="3"/><line x1="255" y1="115" x2="410" y2="105" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="255" cy="115" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="418" y="113" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">头部与意识</text><line x1="258" y1="205" x2="410" y2="195" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="258" cy="205" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="418" y="203" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">胸部与呼吸</text><line x1="255" y1="295" x2="410" y2="285" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="255" cy="295" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="418" y="293" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">腹部与骨盆</text><line x1="247" y1="370" x2="410" y2="375" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="247" cy="370" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="418" y="383" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">四肢感觉与活动</text><text x="255" y="455" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">小擦伤无法显示内部全部情况</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">留意意识、呼吸、胸腹疼痛和肢</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">体感觉变化。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">脸色苍白、冷汗或腹痛加重应立</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">即求助。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">怀疑颈背受伤时避免不必要搬</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">动。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不要要求伤者站起来或活动脊柱以证明无伤。</text>
</g></svg>