0" y2="155" stroke="#af7072" stroke-width="4" stroke-linecap="round"/><path d="M 588.6 161.2 L 600 155 L 588.6 148.8" fill="none" stroke="#af7072" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="600" y1="155" x2="650" y2="290" stroke="#af7072" stroke-width="4" stroke-linecap="round"/><path d="M 640.2 281.5 L 650 290 L 651.9 277.1" fill="none" stroke="#af7072" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="115" y1="300" x2="50" y2="400" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="115" cy="300" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="58" y="408" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">胃肠吸收</text><line x1="330" y1="305" x2="280" y2="410" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="330" cy="305" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="288" y="418" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肝脏代谢</text><line x1="455" y1="315" x2="480" y2="390" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="455" cy="315" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="488" y="398" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肺部吸收</text><line x1="455" y1="155" x2="500" y2="90" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="455" cy="155" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="508" y="98" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">血液分布</text><line x1="650" y1="330" x2="670" y2="400" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="650" cy="330" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="678" y="408" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肾脏排泄</text><text x="390" y="470" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">路径为示意；不同物质的途径各异</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">物质可经不同途径进入，随后分</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">布到组织。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">部分口服物质经肠吸收后先到肝</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">脏。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">肝脏与肾脏参与不同物质的代谢</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">或排出。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">图示不是所有物质的共同路线，浓度还受时间影响。</text>
</g></svg>