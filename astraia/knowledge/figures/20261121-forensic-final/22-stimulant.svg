<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">兴奋剂过量：体温、意识与心脏</title>
<desc id="desc">可能影响多个系统，症状和程度因人而异</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">兴奋剂过量：体温、意识与心脏</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">可能影响多个系统，症状和程度因人而异</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(235 95) scale(1.08)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(235 175) scale(0.25)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M207 65 q15-20 30 0 M242 65 q15-20 30 0" fill="none" stroke="#a7835a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M198 305 q35-20 70 0" fill="none" stroke="#af7072" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="235" y1="95" x2="395" y2="105" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="235" cy="95" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="403" y="113" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">焦躁、意识变化</text><line x1="235" y1="195" x2="395" y2="200" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="235" cy="195" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="403" y="208" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">胸痛、心跳快</text><line x1="235" y1="300" x2="395" y2="295" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="235" cy="300" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="403" y="303" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肌肉疼痛与高热</text><text x="395" y="385" font-size="25" fill="#af7072" font-weight="700" text-anchor="start">抽搐或意识丧失立即急救</text><text x="235" y="455" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">症状可重叠，不用于判断具体物质</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出汗、心跳快、焦躁或说话混乱</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">可能出现。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">高热、胸痛、抽搐或意识异常时</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">立即急救。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">保持周围安全，向医护说明可能</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">接触的物质。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">表现可以重叠，不能根据症状单独确定具体物质。</text>
</g></svg>