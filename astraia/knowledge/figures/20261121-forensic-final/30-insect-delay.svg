<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">昆虫时间线：死亡、进入与定殖</title>
<desc id="desc">不同事件之间的间隔受环境与物种条件影响</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">昆虫时间线：死亡、进入与定殖</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">不同事件之间的间隔受环境与物种条件影响</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<line x1="85" y1="240" x2="740" y2="240" stroke="#668f98" stroke-width="5" stroke-linecap="round"/><path d="M 728.6 246.2 L 740 240 L 728.6 233.8" fill="none" stroke="#668f98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="240" r="11" fill="#af7072" stroke="none" stroke-width="3"/><line x1="140" y1="240" x2="140" y2="320" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><circle cx="330" cy="240" r="11" fill="#a7835a" stroke="none" stroke-width="3"/><line x1="330" y1="240" x2="330" y2="320" stroke="#a7835a" stroke-width="3" stroke-linecap="round"/><circle cx="500" cy="240" r="11" fill="#719481" stroke="none" stroke-width="3"/><line x1="500" y1="240" x2="500" y2="320" stroke="#719481" stroke-width="3" stroke-linecap="round"/><circle cx="690" cy="240" r="11" fill="#668f98" stroke="none" stroke-width="3"/><line x1="690" y1="240" x2="690" y2="320" stroke="#668f98" stroke-width="3" stroke-linecap="round"/><text x="140" y="355" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">死亡发生</text><text x="330" y="355" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">昆虫能接近</text><text x="500" y="355" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">产卵或定殖</text><text x="690" y="355" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">发现采样</text><path d="M140 180 Q235 110 330 180" fill="none" stroke="#a7835a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="130" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">接近可能有延迟</text><path d="M500 180 Q595 130 690 180" fill="none" stroke="#719481" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="595" y="130" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">估计昆虫发育</text><text x="410" y="440" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">室内、遮盖和天气可改变昆虫进入情况</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">昆虫进入场所可能因室内、遮盖</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">或天气而延迟。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">专业人员鉴定物种、发育阶段及</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">温度历史。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">估计昆虫发育时间，还要评估其</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">与死亡的关系。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">事件节点仅为示意，昆虫年龄不能直接当成死亡时刻。</text>
</g></svg>