<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">疑似灭鼠剂误食：包装与身体表现</title>
<desc id="desc">产品成分不同，可影响神经、心脏和循环</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">疑似灭鼠剂误食：包装与身体表现</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">产品成分不同，可影响神经、心脏和循环</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<rect x="60" y="125" width="140" height="210" rx="5" fill="#ede7d9" stroke="#af9e87" stroke-width="4"/><path d="M60 160 H200" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="210" font-size="30" fill="#293e44" font-weight="700" text-anchor="middle">鼠药</text><path d="M90 245 L170 245 M90 268 L170 268" fill="none" stroke="#bbad96" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="215" y1="230" x2="305" y2="230" stroke="#a7835a" stroke-width="4" stroke-linecap="round"/><path d="M 293.6 236.2 L 305 230 L 293.6 223.8" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="150" r="63" fill="#e5d5cb" stroke="#b49b91" stroke-width="3"/><path d="M360 150 Q400 110 440 150 Q400 190 360 150Z" fill="none" stroke="#af7072" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(405 265) scale(0.6)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M520 180 q40-25 80 0 M520 205 q40-25 80 0 M520 230 q40-25 80 0" fill="none" stroke="#668f98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="400" y1="150" x2="520" y2="105" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="150" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="528" y="113" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">意识、抽搐</text><line x1="405" y1="300" x2="520" y2="315" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="405" cy="300" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="528" y="323" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">心律与循环</text><text x="410" y="435" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">包装与症状都需要交给医护判断</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不明灭鼠剂误食后立即联系急救</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">及专业医疗人员。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">抽搐、呼吸异常或意识不清时立</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">即急救。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">若安全可行，保留包装供医护核</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">对。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不要根据外观或单个症状推断具体成分。</text>
</g></svg>