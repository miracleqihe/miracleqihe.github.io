<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">意识不清时：体位与呼吸</title>
<desc id="desc">示意口鼻、气道和胸腹活动之间的位置</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">意识不清时：体位与呼吸</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">示意口鼻、气道和胸腹活动之间的位置</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M115 215 Q170 155 230 200 L300 220 Q355 220 395 245 L550 260 Q580 270 550 295 L400 295 Q330 285 285 278 L220 272 Q170 285 115 265Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95" cy="235" r="42" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M75 226 Q95 215 115 226 M90 248 Q110 255 125 248" fill="none" stroke="#a3897e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 258 Q125 280 150 278 L200 275" fill="none" stroke="#668f98" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 275 Q85 270 110 275" fill="none" stroke="#aab8ad" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><line x1="100" y1="255" x2="40" y2="160" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="255" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="48" y="168" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">口鼻与气道</text><line x1="230" y1="215" x2="365" y2="130" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="230" cy="215" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="373" y="138" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">胸腹运动</text><line x1="530" y1="270" x2="600" y2="230" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="530" cy="270" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="608" y="238" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">身体姿势</text><text x="430" y="410" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">无反应者应呼救并检查正常呼吸</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">柔软物遮住口鼻或姿势受限可能</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">影响呼吸。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">无反应时立即呼救并检查是否正</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">常呼吸。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">无正常呼吸时按调度员指导进行</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">复苏。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">怀疑脊柱损伤或仍有危险时，按急救调度指导处理。</text>
</g></svg>