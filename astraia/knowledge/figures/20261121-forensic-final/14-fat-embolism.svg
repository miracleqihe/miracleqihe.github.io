<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">长骨或骨盆骨折后，脂滴可能进</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">入循环。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">呼吸急促、意识变化或皮肤点状</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出血可能出现。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出现气短或意识变化要立即联系</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">急救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">这些表现并非每次都齐全，也可见于其他病情。</text>
</g></svg>