<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">脂肪栓塞：长骨、血流与肺</title>
<desc id="desc">骨髓、循环与肺部血管的可能关系示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">脂肪栓塞：长骨、血流与肺</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">骨髓、循环与肺部血管的可能关系示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M130 105 Q90 95 93 135 L123 345 Q130 375 165 360 L205 345 Q225 330 215 300 L180 120 Q170 90 130 105Z" fill="#ede5d7" stroke="#b3a28f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 145 L170 310" fill="none" stroke="#a7835a" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="235" r="8" fill="#e4cb8f" stroke="none" stroke-width="3"/><circle cx="210" cy="250" r="8" fill="#e4cb8f" stroke="none" stroke-width="3"/><circle cx="238" cy="245" r="8" fill="#e4cb8f" stroke="none" stroke-width="3"/><line x1="215" y1="250" x2="300" y2="250" stroke="#a7835a" stroke-width="4" stroke-linecap="round"/><path d="M 288.6 256.2 L 300 250 L 288.6 243.8" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(335 218) scale(0.3)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="365" y1="245" x2="400" y2="245" stroke="#af7072" stroke-width="4" stroke-linecap="round"/><path d="M 388.6 251.2 L 400 245 L 388.6 238.8" fill="none" stroke="#af7072" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(480 205) scale(1.15)"><path d="M0 5 C-32 -17 -62 4 -70 43 Q-82 105 -21 108 L0 85 M0 5 C32 -17 62 4 70 43 Q82 105 21 108 L0 85" fill="#e4c5bf" stroke="#b68b83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -65 V43 M0 23 L-38 58 M0 23 L38 58" fill="none" stroke="#668f98" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M400 245 H420 M420 245 L440 225 M420 245 L440 270 M420 245 Q470 215 510 245 L540 225 M510 245 L540 270" fill="none" stroke="#af7072" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="150" y1="180" x2="55" y2="80" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="150" cy="180" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="63" y="88" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">长骨骨髓</text><line x1="250" y1="245" x2="210" y2="350" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="250" cy="245" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="218" y="358" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">脂滴进入循环</text><line x1="470" y1="245" x2="600" y2="145" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="470" cy="245" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="608" y="153" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肺部血管</text><text x="600" y="235" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">呼吸变化、意识改变</text><text x="600" y="320" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">外表红点可有可无</text><text x="410" y="455" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">个体发生机制与表现可能不同</text>
