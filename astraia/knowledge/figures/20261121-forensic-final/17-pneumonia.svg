<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">肺炎可使肺泡内出现液体或炎性</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">物质。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">呼吸困难、发热或意识变化可能</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">提示严重病情。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">老人和婴幼儿的表现可能不典</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">型。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">突然呼吸困难、意识异常或明显发青时立即急救。</text>
</g></svg>