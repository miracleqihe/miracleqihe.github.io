<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">肺炎：肺泡、炎性物质与换气</title>
<desc id="desc">肺泡簇和血管的简化示意</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">肺炎：肺泡、炎性物质与换气</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">肺泡簇和血管的简化示意</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<circle cx="215" cy="160" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="170" cy="195" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="260" cy="195" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="180" cy="250" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="250" cy="250" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="585" cy="160" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="540" cy="195" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="630" cy="195" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="550" cy="250" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><circle cx="620" cy="250" r="33" fill="#e5f0e7" stroke="#91af9c" stroke-width="3"/><path d="M120 320 Q215 350 310 320 M490 320 Q585 350 680 320" fill="none" stroke="#af7072" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="540" cy="195" r="18" fill="#d4bc8d" stroke="none" stroke-width="3"/><circle cx="585" cy="198" r="18" fill="#d4bc8d" stroke="none" stroke-width="3"/><circle cx="620" cy="250" r="18" fill="#d4bc8d" stroke="none" stroke-width="3"/><text x="215" y="75" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">正常通气示意</text><text x="585" y="75" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">炎症时可有液体</text><line x1="215" y1="160" x2="80" y2="265" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="215" cy="160" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="88" y="273" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">肺泡</text><line x1="585" y1="198" x2="580" y2="355" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="585" cy="198" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="588" y="363" font-size="26" fill="#293e44" font-weight="400" text-anchor="start">液体或炎性物质</text><text x="410" y="445" font-size="25" fill="#596b6d" font-weight="400" text-anchor="middle">炎症可能影响氧气交换</text>
