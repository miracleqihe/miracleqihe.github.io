<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">热射病的识别与现场处理</title><desc id="desc">高温下出现意识混乱、抽搐或昏迷，立即呼叫急救，转移至阴凉处并用冷水持续降温，不喂饮。</desc>
<rect x="1" y="1" width="1198" height="398" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" fill="#293b34">
<text x="28" y="43" font-size="30" font-weight="700">热射病：识别异常，立即行动</text>
<g fill="#f9f0e9" stroke="#e5d5cb" stroke-width="1.5"><rect x="25" y="66" width="350" height="258" rx="12"/><rect x="425" y="66" width="350" height="258" rx="12"/><rect x="825" y="66" width="350" height="258" rx="12"/></g>
<g stroke="#9a624e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="200" cy="145" r="48"/><path d="M200 112 v43 M200 177 v2"/>
<rect x="563" y="95" width="74" height="110" rx="13"/><path d="M585 108 h30 M590 190 h20"/><path d="M650 116 q24 24 0 48 M666 101 q38 39 0 77"/>
<path d="M976 108 h48 v96 h-48 z M987 97 h26 M986 139 h28 M1000 125 v28"/><path d="M955 129 q-17 17-17 31 q0 12 11 12 t11-12 q0-8-5-17 M1046 129 q17 17 17 31 q0 12-11 12 t-11-12 q0-8 5-17"/>
<path d="M390 190 h25 m-10-9 10 9-10 9 M790 190 h25 m-10-9 10 9-10 9"/>
</g>
<g text-anchor="middle"><text x="200" y="240" font-size="27" font-weight="700">① 发现危险表现</text><text x="200" y="278" font-size="24">意识混乱、抽搐或昏迷</text><text x="200" y="307" font-size="22" fill="#685c55">高温暴露后应立即警觉</text>
<text x="600" y="240" font-size="27" font-weight="700">② 呼叫急救</text><text x="600" y="278" font-size="24">移至阴凉处，脱去外衣</text><text x="600" y="307" font-size="22" fill="#685c55">陪伴患者，等待救援</text>
<text x="1000" y="240" font-size="27" font-weight="700">③ 迅速持续降温</text><text x="1000" y="278" font-size="24">冷水湿敷或淋身并扇风</text><text x="1000" y="307" font-size="22" fill="#685c55">急救到达前继续降温</text></g>
<rect x="25" y="341" width="1150" height="38" rx="7" fill="#f4e3dd"/><text x="43" y="368" font-size="23" fill="#844b3d">疑似热射病时不要喂饮；患者仍可能出汗，不能据此排除热射病。</text>
</g></svg>
