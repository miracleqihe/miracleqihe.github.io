<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">活体损伤：从位置到随访变化</title>
<desc id="desc">征得当事人同意，记录与治疗并行</desc>
<rect x="1" y="1" width="1398" height="658" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="32" y="47" fill="#293b43" font-size="38" font-weight="700" text-anchor="start">活体损伤：从位置到随访变化</text>
<text x="33" y="85" fill="#52636a" font-size="24" font-weight="400" text-anchor="start">征得当事人同意，记录与治疗并行</text>
<rect x="26" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="242" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">标出位置</text>
<g transform="translate(112 172)">
<circle cx="82" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 66 35 Q 82 30 98 35 L 102 75 L 95 85 L 93 121 L 84 121 L 82 87 L 80 121 L 71 121 L 69 85 L 62 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 66 38 L 49 82 M 98 38 L 115 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="184" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 168 35 Q 184 30 200 35 L 204 75 L 197 85 L 195 121 L 186 121 L 184 87 L 182 121 L 173 121 L 171 85 L 164 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 168 38 L 151 82 M 200 38 L 217 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="74" cy="79" r="6" fill="#ad5c58" stroke="none" stroke-width="2"/><circle cx="191" cy="64" r="6" fill="#ad5c58" stroke="none" stroke-width="2"/><text x="82" y="128" fill="#52636a" font-size="18" font-weight="400" text-anchor="middle">前</text><text x="184" y="128" fill="#52636a" font-size="18" font-weight="400" text-anchor="middle">后</text>
</g>
<text x="51" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">用前后位置说明左右侧与部</text>
<text x="51" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">位。描述面积、肿胀、疼痛</text>
<text x="51" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">或麻木。记首次发现时间和</text>
<text x="51" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">受伤经过。</text>
<rect x="484" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="700" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">保存原图</text>
<g transform="translate(570 172)">
<rect x="15" y="12" width="100" height="94" rx="5" fill="#fbfaf6" stroke="#8ca1a1" stroke-width="3"/><rect x="145" y="12" width="100" height="94" rx="5" fill="#fbfaf6" stroke="#8ca1a1" stroke-width="3"/><circle cx="62" cy="57" r="18" fill="#bd99a0" stroke="none" stroke-width="2"/><circle cx="192" cy="57" r="25" fill="#c5a6a2" stroke="none" stroke-width="2"/><text x="65" y="126" fill="#52636a" font-size="18" font-weight="400" text-anchor="middle">初诊</text><text x="195" y="126" fill="#52636a" font-size="18" font-weight="400" text-anchor="middle">复查</text>
</g>
<text x="509" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">取得同意后拍整体和局部。</text>
<text x="509" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">记录日期；尽量保持可比较</text>
<text x="509" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">的角度与光线，保留原始照</text>
<text x="509" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">片。</text>
<rect x="942" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="1158" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">跟踪功能</text>
<g transform="translate(1028 172)">
<rect x="50" y="4" width="160" height="115" rx="5" fill="#fbfaf6" stroke="#8ca1a1" stroke-width="3"/><path d="M75 32 h100 M75 56 h100 M75 80 h72" fill="none" stroke="#8ca1a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="185" cy="84" r="10" fill="#d7e4df" stroke="none" stroke-width="2"/>
</g>
<text x="967" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">保存诊疗、影像和复诊记</text>
<text x="967" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">录。活动范围和恢复情况可</text>
<text x="967" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">变化。私密部位由医护按规</text>
<text x="967" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">范处理。</text>
<rect x="26" y="558" width="1348" height="81" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="44" y="590" fill="#785334" font-size="25" font-weight="400" text-anchor="start">颜色会受皮肤、照明、深度和药物影响，不能单凭颜色准确推算受伤时间。</text>
<text x="44" y="622" fill="#785334" font-size="25" font-weight="400" text-anchor="start">疼痛加剧、活动障碍或异常出血时及时就医。</text>
</g></svg>