<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">体位与尸斑：低位、受压和移动</title>
<desc id="desc">示意图按姿势比较；着色范围并非每个个案都会相同</desc>
<rect x="1" y="1" width="1398" height="658" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="32" y="47" fill="#293b43" font-size="38" font-weight="700" text-anchor="start">体位与尸斑：低位、受压和移动</text>
<text x="33" y="85" fill="#52636a" font-size="24" font-weight="400" text-anchor="start">示意图按姿势比较；着色范围并非每个个案都会相同</text>
<rect x="26" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="242" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">A  仰卧：背面</text>
<g transform="translate(112 172)">
<circle cx="88" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 72 35 Q 88 30 104 35 L 108 75 L 101 85 L 99 121 L 90 121 L 88 87 L 86 121 L 77 121 L 75 85 L 68 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 72 38 L 55 82 M 104 38 L 121 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 75 49 Q 88 41 101 49 L 99 75 Q 88 83 77 75 Z" fill="#b28898" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="52" r="4" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="96" cy="52" r="4" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="81" cy="77" r="3" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="95" cy="77" r="3" fill="#f2e3d8" stroke="none" stroke-width="2"/><text x="150" y="42" fill="#52636a" font-size="23" font-weight="400" text-anchor="start">背面</text><text x="150" y="76" fill="#52636a" font-size="22" font-weight="400" text-anchor="start">浅点：</text><text x="150" y="105" fill="#52636a" font-size="22" font-weight="400" text-anchor="start">接触受压</text>
</g>
<text x="51" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">背部、腰臀等低处可出现尸</text>
<text x="51" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">斑。肩胛、臀部接触区可能</text>
<text x="51" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">较浅。记录身体、衣物和支</text>
<text x="51" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">撑面位置。</text>
<rect x="484" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="700" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">B  悬垂：自然下垂</text>
<g transform="translate(570 172)">
<circle cx="88" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 72 35 Q 88 30 104 35 L 108 75 L 101 85 L 99 121 L 90 121 L 88 87 L 86 121 L 77 121 L 75 85 L 68 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 72 38 L 55 82 M 104 38 L 121 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 77 97 L 86 97 L 86 121 L 77 121 Z M 90 97 L 99 97 L 99 121 L 90 121 Z" fill="#b28898" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="82" r="5" fill="#b28898" stroke="none" stroke-width="2"/><circle cx="121" cy="82" r="5" fill="#b28898" stroke="none" stroke-width="2"/><text x="146" y="44" fill="#52636a" font-size="22" font-weight="400" text-anchor="start">自然下垂</text><text x="146" y="76" fill="#52636a" font-size="22" font-weight="400" text-anchor="start">手与足</text><text x="146" y="108" fill="#52636a" font-size="22" font-weight="400" text-anchor="start">可能显色</text>
</g>
<text x="509" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">小腿、足及下垂的手可能着</text>
<text x="509" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">色。手抬高或肢体接触支撑</text>
<text x="509" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">面时，低位和受压位置都会</text>
<text x="509" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">改变。</text>
<rect x="942" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="1158" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">C  姿势改变后</text>
<g transform="translate(1028 172)">
<circle cx="55" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 39 35 Q 55 30 71 35 L 75 75 L 68 85 L 66 121 L 57 121 L 55 87 L 53 121 L 44 121 L 42 85 L 35 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 39 38 L 22 82 M 71 38 L 88 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 42 49 Q 55 41 68 49 L 66 75 Q 55 83 44 75 Z" fill="#b28898" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="52" r="4" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="63" cy="52" r="4" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="48" cy="77" r="3" fill="#f2e3d8" stroke="none" stroke-width="2"/><circle cx="62" cy="77" r="3" fill="#f2e3d8" stroke="none" stroke-width="2"/><line x1="99" y1="65" x2="155" y2="65" stroke="#83999b" stroke-width="4" stroke-linecap="round"/><path d="M 143 56 L 155 65 L 143 74" fill="none" stroke="#83999b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="204" cy="17" r="12" fill="#eadbd1" stroke="#a8897c" stroke-width="2"/><path d="M 188 35 Q 204 30 220 35 L 224 75 L 217 85 L 215 121 L 206 121 L 204 87 L 202 121 L 193 121 L 191 85 L 184 75 Z" fill="#eadbd1" stroke="#a8897c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 188 38 L 171 82 M 220 38 L 237 82" fill="none" stroke="#a8897c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M 193 97 L 202 97 L 202 121 L 193 121 Z M 206 97 L 215 97 L 215 121 L 206 121 Z" fill="#b28898" stroke="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="171" cy="82" r="5" fill="#b28898" stroke="none" stroke-width="2"/><circle cx="237" cy="82" r="5" fill="#b28898" stroke="none" stroke-width="2"/><text x="130" y="123" fill="#52636a" font-size="19" font-weight="400" text-anchor="middle">姿势改变</text>
</g>
<text x="967" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">早期改变体位可使分布变</text>
<text x="967" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">化。部分旧分布可能仍然保</text>
<text x="967" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">留。记录救治、翻身和搬动</text>
<text x="967" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">经过。</text>
<rect x="26" y="558" width="1348" height="81" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="44" y="590" fill="#785334" font-size="25" font-weight="400" text-anchor="start">图中颜色仅帮助阅读，不代表实际色调或固定时间。</text>
<text x="44" y="622" fill="#785334" font-size="25" font-weight="400" text-anchor="start">发现无反应者先按急救调度指导处理，不为检查而翻动身体。</text>
</g></svg>