<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">现场摄影：让细节能回到现场</title>
<desc id="desc">先确认环境安全；专业人员根据情况布置比例尺</desc>
<rect x="1" y="1" width="1398" height="658" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="32" y="47" fill="#293b43" font-size="38" font-weight="700" text-anchor="start">现场摄影：让细节能回到现场</text>
<text x="33" y="85" fill="#52636a" font-size="24" font-weight="400" text-anchor="start">先确认环境安全；专业人员根据情况布置比例尺</text>
<rect x="26" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="242" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">① 全景：空间关系</text>
<g transform="translate(112 172)">
<rect x="20" y="15" width="220" height="95" rx="4" fill="#f9fbfa" stroke="#829da3" stroke-width="3"/><path d="M20 81 h220 M164 15 v66 M187 15 v66 M46 35 h45 v25 h-45 z" fill="none" stroke="#829da3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="118" cy="94" r="7" fill="#9cb2ae" stroke="none" stroke-width="2"/>
</g>
<text x="51" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">拍门、地面、家具与物体位</text>
<text x="51" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">置。多个方向有助于辨认方</text>
<text x="51" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">位。记录拍摄方向和原始文</text>
<text x="51" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">件。</text>
<rect x="484" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="700" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">② 中景：局部位置</text>
<g transform="translate(570 172)">
<rect x="20" y="15" width="220" height="95" rx="4" fill="#f9fbfa" stroke="#829da3" stroke-width="3"/><path d="M180 15 v95 M202 15 v95" fill="none" stroke="#829da3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(70 20) scale(0.7)"><path d="M 42 3 C 13 3, 8 29, 17 52 L 22 97 Q 42 120 62 97 L 67 52 C 76 29, 71 3, 42 3 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="25" y1="22" x2="59" y2="22" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="34" x2="59" y2="34" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="46" x2="59" y2="46" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="68" x2="59" y2="68" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="80" x2="59" y2="80" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="25" y1="92" x2="59" y2="92" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/></g>
</g>
<text x="509" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">拍痕迹与门框、墙角等参照</text>
<text x="509" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">物。画面既看见痕迹，也看</text>
<text x="509" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">见它所在的具体区域。</text>
<rect x="942" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="1158" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">③ 细节：可比尺寸</text>
<g transform="translate(1028 172)">
<path d="M 84 6 C 55 6, 50 32, 59 55 L 64 100 Q 84 123 104 100 L 109 55 C 118 32, 113 6, 84 6 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="67" y1="25" x2="101" y2="25" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="67" y1="37" x2="101" y2="37" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="67" y1="49" x2="101" y2="49" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="67" y1="71" x2="101" y2="71" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="67" y1="83" x2="101" y2="83" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="67" y1="95" x2="101" y2="95" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><path d="M 91 72 l-7 5 8 6" fill="none" stroke="#b05e53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="89" cy="79" r="12" fill="none" stroke="#b05e53" stroke-width="2"/><line x1="158" y1="15" x2="158" y2="110" stroke="#718e90" stroke-width="4" stroke-linecap="round"/><line x1="152" y1="22" x2="164" y2="22" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><line x1="152" y1="38" x2="164" y2="38" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><line x1="152" y1="54" x2="164" y2="54" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><line x1="152" y1="70" x2="164" y2="70" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><line x1="152" y1="86" x2="164" y2="86" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><line x1="152" y1="102" x2="164" y2="102" stroke="#718e90" stroke-width="3" stroke-linecap="round"/><text x="190" y="68" fill="#52636a" font-size="20" font-weight="400" text-anchor="start">尺</text>
</g>
<text x="967" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">拍清纹样，分别保留无尺和</text>
<text x="967" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">带尺照。镜头尽量垂直印迹</text>
<text x="967" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">所在平面；比例尺与印迹放</text>
<text x="967" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">在同一平面。</text>
<rect x="26" y="558" width="1348" height="81" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="44" y="590" fill="#785334" font-size="25" font-weight="400" text-anchor="start">救人优先；未获授权者不要进入危险或受控区域，也不要自行移动痕迹。</text>
<text x="44" y="622" fill="#785334" font-size="25" font-weight="400" text-anchor="start">弯曲表面、斜拍、裁切或畸变会影响尺寸比较。</text>
</g></svg>