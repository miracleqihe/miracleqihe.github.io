<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">鞋印比较：纹样、磨损与缺失</title>
<desc id="desc">图中两个鞋底只是教学符号，颜色圈标出可比较位置</desc>
<rect x="1" y="1" width="1398" height="658" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="32" y="47" fill="#293b43" font-size="38" font-weight="700" text-anchor="start">鞋印比较：纹样、磨损与缺失</text>
<text x="33" y="85" fill="#52636a" font-size="24" font-weight="400" text-anchor="start">图中两个鞋底只是教学符号，颜色圈标出可比较位置</text>
<rect x="26" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="242" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">鞋底纹样与大小</text>
<g transform="translate(112 172)">
<path d="M 74 7 C 45 7, 40 33, 49 56 L 54 101 Q 74 124 94 101 L 99 56 C 108 33, 103 7, 74 7 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="57" y1="26" x2="91" y2="26" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="57" y1="38" x2="91" y2="38" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="57" y1="50" x2="91" y2="50" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="57" y1="72" x2="91" y2="72" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="57" y1="84" x2="91" y2="84" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="57" y1="96" x2="91" y2="96" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><path d="M 190 7 C 161 7, 156 33, 165 56 L 170 101 Q 190 124 210 101 L 215 56 C 224 33, 219 7, 190 7 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="173" y1="26" x2="207" y2="26" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="38" x2="207" y2="38" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="50" x2="207" y2="50" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="72" x2="207" y2="72" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="84" x2="207" y2="84" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="96" x2="207" y2="96" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><text x="128" y="126" fill="#52636a" font-size="17" font-weight="400" text-anchor="middle">相同花纹可见于多双鞋</text>
</g>
<text x="51" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">条纹、形状、标识与尺寸属</text>
<text x="51" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">于比较类别的线索；不同鞋</text>
<text x="51" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">可能具有同样的生产纹样。</text>
<rect x="484" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="700" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">磨损与局部缺口</text>
<g transform="translate(570 172)">
<path d="M 132 7 C 103 7, 98 33, 107 56 L 112 101 Q 132 124 152 101 L 157 56 C 166 33, 161 7, 132 7 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="115" y1="26" x2="149" y2="26" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="38" x2="149" y2="38" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="50" x2="149" y2="50" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="72" x2="149" y2="72" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="84" x2="149" y2="84" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="96" x2="149" y2="96" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><path d="M 139 73 l-7 5 8 6" fill="none" stroke="#b05e53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="137" cy="80" r="12" fill="none" stroke="#b05e53" stroke-width="2"/><text x="183" y="40" fill="#9d6157" font-size="19" font-weight="400" text-anchor="start">缺口</text><line x1="153" y1="46" x2="180" y2="38" stroke="#9d6157" stroke-width="2" stroke-linecap="round"/>
</g>
<text x="509" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">记录鞋跟、前掌磨损位置，</text>
<text x="509" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">比较缺口等细节所在的区</text>
<text x="509" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">域。可见清晰度影响比较价</text>
<text x="509" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">值。</text>
<rect x="942" y="108" width="432" height="435" rx="12" fill="#f0f5f3" stroke="#d5dfdc" stroke-width="1.5"/>
<text x="1158" y="151" fill="#293b43" font-size="30" font-weight="700" text-anchor="middle">部分印迹与变形</text>
<g transform="translate(1028 172)">
<path d="M 132 7 C 103 7, 98 33, 107 56 L 112 101 Q 132 124 152 101 L 157 56 C 166 33, 161 7, 132 7 Z" fill="#d5e0dc" stroke="#6e8b87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="115" y1="26" x2="149" y2="26" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="38" x2="149" y2="38" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="50" x2="149" y2="50" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="72" x2="149" y2="72" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="84" x2="149" y2="84" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><line x1="115" y1="96" x2="149" y2="96" stroke="#6e8b87" stroke-width="3" stroke-linecap="round"/><rect x="94" y="66" width="80" height="50" rx="0" fill="#f1f5f4" stroke="none" stroke-width="0"/><text x="134" y="95" fill="#52636a" font-size="17" font-weight="400" text-anchor="middle">未显现</text>
</g>
<text x="967" y="345" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">泥、水、压力和拖擦会影响</text>
<text x="967" y="378" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">印迹。缺失部分只是没有显</text>
<text x="967" y="411" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">现，不表示鞋底原本没有对</text>
<text x="967" y="444" fill="#293b43" font-size="29" font-weight="400" text-anchor="start">应纹样。</text>
<rect x="26" y="558" width="1348" height="81" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="44" y="590" fill="#785334" font-size="25" font-weight="400" text-anchor="start">花纹相似不能直接确认同一双鞋或穿鞋的人。</text>
<text x="44" y="622" fill="#785334" font-size="25" font-weight="400" text-anchor="start">保留印迹与门、家具的关系，不自行试踩或触碰。</text>
</g></svg>