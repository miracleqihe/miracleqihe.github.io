<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">野外如厕：先查规定，再选位置</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">有些地区要求将排泄物装袋带走；不能随处挖坑。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<path d="M 70 195 Q 190 142 300 204 T 505 205" fill="none" stroke="#326f80" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 85 355 Q 202 290 311 348 T 505 327" fill="none" stroke="#bb8737" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/>
<path d="M 156 279 L 191 224 L 225 279 Z" fill="#d1dfc8" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="190" y="311" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">营地</text>
<circle cx="419" cy="270" r="28" fill="#d7c5a7" stroke="#bb8737" stroke-width="2"/>
<text x="420" y="275" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="700" text-anchor="middle">坑</text>
<line x1="415" y1="240" x2="322" y2="201" stroke="#326f80" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="389" y1="280" x2="297" y2="335" stroke="#326f80" stroke-width="2" stroke-dasharray="5 4"/>
<text x="267" y="150" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">水源</text>
<text x="230" y="390" fill="#bb8737" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">步道</text>
<text x="430" y="187" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">与水源、营地、步道</text>
<text x="430" y="214" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">各至少保持 61 米</text>
<line x1="565" y1="120" x2="565" y2="443" stroke="#d9e5df" stroke-width="2"/>
<line x1="600" y1="260" x2="1106" y2="260" stroke="#263b3e" stroke-width="3"/>
<path d="M 790 260 L 800 356 Q 835 373 870 356 L 880 260" fill="#d9c5a6" stroke="#9d8061" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 801 324 Q 836 314 869 324 L 870 356 Q 836 372 800 356 Z" fill="#a88e6e" stroke="#9d8061" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="908" y1="262" x2="908" y2="355" stroke="#326f80" stroke-width="3"/>
<line x1="898" y1="262" x2="918" y2="262" stroke="#326f80" stroke-width="3"/>
<line x1="898" y1="355" x2="918" y2="355" stroke="#326f80" stroke-width="3"/>
<text x="932" y="312" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">约 15—20 厘米</text>
<text x="833" y="398" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">用后原土覆盖</text>
<text x="835" y="170" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="middle">仅在当地允许且土壤合适时</text>
<text x="600" y="485" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">纸和卫生用品装袋带走；避开洪泛地及取水点上游。</text>
</svg>