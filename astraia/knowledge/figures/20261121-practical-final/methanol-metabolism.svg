<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">甲醇中毒：代谢物与视力变化</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">怀疑误饮立即就医，不等待视物模糊。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<rect x="65" y="170" width="218" height="115" rx="8" fill="#eef4f1" stroke="#c7d8d1" stroke-width="2"/>
<text x="174" y="215" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="middle">甲醇</text>
<text x="174" y="252" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">工业溶剂、燃料</text>
<rect x="332" y="170" width="218" height="115" rx="8" fill="#eef4f1" stroke="#c7d8d1" stroke-width="2"/>
<text x="441" y="215" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="middle">甲醛</text>
<text x="441" y="252" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">中间代谢物</text>
<rect x="598" y="170" width="218" height="115" rx="8" fill="#eef4f1" stroke="#c7d8d1" stroke-width="2"/>
<text x="707" y="215" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="27" font-weight="700" text-anchor="middle">甲酸</text>
<text x="707" y="252" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">可引起酸中毒</text>
<line x1="290" y1="226" x2="325" y2="226" stroke="#326f80" stroke-width="3"/>
<path d="M 313.5 232.0 L 325 226 L 313.5 220.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="557" y1="226" x2="590" y2="226" stroke="#326f80" stroke-width="3"/>
<path d="M 578.5 232.0 L 590 226 L 578.5 220.0" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="824" y1="226" x2="878" y2="226" stroke="#a94d37" stroke-width="3"/>
<path d="M 866.5 232.0 L 878 226 L 866.5 220.0" fill="none" stroke="#a94d37" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<ellipse cx="987" cy="227" rx="91" ry="54" fill="#fff" stroke="#d4a290" stroke-width="3"/>
<circle cx="987" cy="227" r="24" fill="#b7ced0" stroke="#326f80" stroke-width="3"/>
<circle cx="987" cy="227" r="10" fill="#263b3e" stroke="#263b3e" stroke-width="2"/>
<text x="987" y="318" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">视神经受损</text>
<text x="155" y="365" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">早期可无明显症状</text>
<text x="451" y="365" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">后来可能深快呼吸、视物模糊</text>
<text x="155" y="410" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">不要催吐，也不要自行饮酒“解毒”</text>
<text x="600" y="485" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">带上产品信息告知医护；医院根据病情考虑解毒药和透析。</text>
</svg>