<circle cx="250" cy="320" r="20" fill="#f2ddce" stroke="#263b3e" stroke-width="3"/>
<path d="M 250 340 L 250 385 M 250 355 L 225 372 M 250 355 L 273 370 M 250 385 L 227 420 M 250 385 L 273 420" fill="none" stroke="#263b3e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
