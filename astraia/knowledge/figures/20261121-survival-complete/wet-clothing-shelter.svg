<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">衣物湿透后：遮风、换干、包裹身体</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">根据环境和状态减缓继续失热；意识变化、行动笨拙或停止发抖时立即求助。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<path d="M 100 370 L 240 175 L 380 370 Z" fill="#e9dfc9" stroke="#a38b66" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 170 370 L 240 245 L 310 370 Z" fill="#dce8e3" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 460 210 Q 448 235 460 248 Q 472 235 460 210 Z" fill="#b8d8df" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 500 245 Q 488 270 500 283 Q 512 270 500 245 Z" fill="#b8d8df" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 540 190 Q 528 215 540 228 Q 552 215 540 190 Z" fill="#b8d8df" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="430" y1="310" x2="570" y2="310" stroke="#326f80" stroke-width="4"/>
<path d="M 558.5 316.0 L 570 310 L 558.5 304.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="700" y="190" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">先转移到安全避风处</text>
<text x="700" y="240" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">有干衣或干布时更换并包裹</text>
<text x="700" y="290" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">身下增加隔热层</text>
<text x="700" y="340" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">保持陪伴并监测呼吸和意识</text>
<text x="600" y="480" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">救助者避免继续暴露，重度低体温需专业急救。</text>
</svg>