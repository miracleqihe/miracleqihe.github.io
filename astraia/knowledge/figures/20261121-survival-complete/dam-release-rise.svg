<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">上游水坝放水：下游晴天也可能涨水</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">水位和流速可以随调度变化；先看告示并确认能到达的高处。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<path d="M 80 220 L 260 220 L 260 360 L 80 360 Z" fill="#d1e8eb" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 260 150 L 310 150 L 310 370 L 260 370 Z" fill="#c8ccc5" stroke="#87958b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 310 320 Q 500 290 700 320 L 700 370 L 310 370 Z" fill="#d8ecee" stroke="#326f80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="330" y1="335" x2="590" y2="335" stroke="#326f80" stroke-width="4"/>
<path d="M 578.5 341.0 L 590 335 L 578.5 329.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 600 320 L 780 200 L 930 200" fill="none" stroke="#9aa88e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="650" y1="300" x2="760" y2="225" stroke="#a94d37" stroke-width="4"/>
<path d="M 753.9 236.5 L 760 225 L 747.1 226.5" fill="none" stroke="#a94d37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<text x="780" y="200" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">向安全高处撤离</text>
<text x="160" y="190" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">水库</text>
<text x="475" y="280" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="400" text-anchor="middle">下游河道</text>
<text x="600" y="480" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">遵守水电站与河道警示；不要等到水明显上涨才离开。</text>
</svg>