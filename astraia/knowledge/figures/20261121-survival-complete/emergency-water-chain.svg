<text x="922" y="250" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="middle">洁净容器</text>
<text x="600" y="424" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">清水滚沸 1 分钟；海拔较高地区按当地建议延长。</text>
<text x="600" y="480" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">消毒片按标签与水量使用；化学污染不能靠简单过滤或煮沸消除。</text>
