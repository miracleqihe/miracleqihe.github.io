<text x="157" y="220" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">取水</text>
<line x1="250" y1="265" x2="320" y2="265" stroke="#326f80" stroke-width="4"/>
<path d="M 308.5 271.0 L 320 265 L 308.5 259.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<rect x="330" y="165" width="165" height="200" rx="12" fill="#f5eee0" stroke="#bb8737" stroke-width="3"/>
<path d="M 350 225 L 475 225 L 440 285 L 385 285 Z" fill="#e5dbc6" stroke="#aa9c84" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="412" y="330" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">浑浊先澄清</text>
<line x1="505" y1="265" x2="575" y2="265" stroke="#326f80" stroke-width="4"/>
<path d="M 563.5 271.0 L 575 265 L 563.5 259.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<rect x="585" y="165" width="165" height="200" rx="12" fill="#edf2ed" stroke="#60816a" stroke-width="3"/>
<path d="M 620 290 L 715 290 L 705 330 L 630 330 Z" fill="#d7e6e2" stroke="#60816a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="667" y="220" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle">煮沸</text>
<line x1="760" y1="265" x2="830" y2="265" stroke="#326f80" stroke-width="4"/>
<path d="M 818.5 271.0 L 830 265 L 818.5 259.0" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
