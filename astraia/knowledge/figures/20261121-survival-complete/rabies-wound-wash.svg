<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">动物咬抓：立即清洗伤口并尽快就医</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">流动水与肥皂或清洁剂可用于冲洗；大出血时先按急救指导止血。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<path d="M 90 310 Q 210 280 420 305 L 515 325 L 515 365 L 90 365 Z" fill="#f0dacc" stroke="#a78d7e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 310 310 L 325 330 M 330 307 L 345 330" fill="none" stroke="#a94d37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 270 140 L 360 140 L 360 180 L 315 180 L 315 210" fill="none" stroke="#326f80" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
<line x1="300" y1="210" x2="300" y2="280" stroke="#326f80" stroke-width="3"/>
<path d="M 294.0 268.5 L 300 280 L 306.0 268.5" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="315" y1="210" x2="315" y2="280" stroke="#326f80" stroke-width="3"/>
<path d="M 309.0 268.5 L 315 280 L 321.0 268.5" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="330" y1="210" x2="330" y2="280" stroke="#326f80" stroke-width="3"/>
<path d="M 324.0 268.5 L 330 280 L 336.0 268.5" fill="none" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="300" y="423" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">用大量清水和肥皂冲洗约 15 分钟</text>
<text x="660" y="185" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="23" font-weight="700" text-anchor="start">记录动物与接触时间</text>
<text x="660" y="235" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">及时接受暴露风险评估</text>
<text x="660" y="285" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">按医护判断接种疫苗等</text>
<text x="600" y="480" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">不要用刺激性偏方处理；无法安全接触动物时不要尝试抓捕。</text>
</svg>