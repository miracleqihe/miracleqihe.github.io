<line x1="220" y1="285" x2="340" y2="285" stroke="#263b3e" stroke-width="3"/>
<line x1="220" y1="315" x2="340" y2="315" stroke="#263b3e" stroke-width="3"/>
<line x1="235" y1="205" x2="235" y2="155" stroke="#326f80" stroke-width="4"/>
<path d="M 241.0 166.5 L 235 155 L 229.0 166.5" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
