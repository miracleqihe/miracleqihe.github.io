<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">受损屋顶光伏：市电断开后仍可能有带电部分</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">太阳照射时，组件及部分直流线路仍可能带电；储能设备也可能存有电能。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<path d="M 90 345 L 90 225 L 300 125 L 510 225 L 510 345 Z" fill="#ece6dc" stroke="#a1978a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 175 197 L 300 137 L 455 210 L 365 235 Z" fill="#a9c4c6" stroke="#326f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="245" y1="165" x2="390" y2="232" stroke="#326f80" stroke-width="2"/>
<line x1="300" y1="140" x2="300" y2="230" stroke="#326f80" stroke-width="2"/>
<circle cx="620" cy="150" r="30" fill="#f2d38d" stroke="#bb8737" stroke-width="3"/>
<line x1="620" y1="190" x2="500" y2="225" stroke="#bb8737" stroke-width="3"/>
<path d="M 509.4 216.0 L 500 225 L 512.8 227.5" fill="none" stroke="#bb8737" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<rect x="560" y="275" width="110" height="80" rx="8" fill="#e9eae4" stroke="#9fa69c" stroke-width="2"/>
<text x="615" y="323" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="18" font-weight="400" text-anchor="middle">市电断开</text>
<text x="800" y="190" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start">远离受损组件和电线</text>
<text x="800" y="240" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">不要碰触或自行清理</text>
<text x="800" y="290" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start">联系安装商或专业人员</text>
<text x="600" y="480" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="middle">积水和倒塌结构会扩大危险；现场处理由专业人员执行。</text>
</svg>