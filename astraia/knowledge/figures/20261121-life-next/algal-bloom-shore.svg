<path d="M 275 235 q 45 -30 80 0 l 20 35 l -12 20 l -20 -10 l -30 0 l -15 12 l -20 -12 Z" fill="#9d8065" stroke="#765e4d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
