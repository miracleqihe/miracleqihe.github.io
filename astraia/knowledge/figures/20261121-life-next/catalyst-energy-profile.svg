<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="16" fill="#fbfaf6"/>
<text x="40" y="44" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="30" font-weight="700" text-anchor="start">催化剂与反应路径：比较能垒</text>
<text x="40" y="79" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">示意图比较两个路径；反应物和产物的能量水平不变。</text>
<line x1="40" y1="93" x2="1160" y2="93" stroke="#dce6df" stroke-width="2"/>
<line x1="110" y1="390" x2="700" y2="390" stroke="#263b3e" stroke-width="3"/>
<path d="M 688.5 396.0 L 700 390 L 688.5 384.0" fill="none" stroke="#263b3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<line x1="110" y1="390" x2="110" y2="125" stroke="#263b3e" stroke-width="3"/>
<path d="M 116.0 136.5 L 110 125 L 104.0 136.5" fill="none" stroke="#263b3e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="718" y="395" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">反应进程</text>
<text x="80" y="127" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">相对能量</text>
<path d="M 150 335 C 230 335 260 155 365 150 C 470 155 500 310 650 310" fill="none" stroke="#a94d37" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<path d="M 150 335 C 260 335 280 225 365 225 C 450 225 500 310 650 310" fill="none" stroke="#326f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
<line x1="145" y1="335" x2="180" y2="335" stroke="#263b3e" stroke-width="4"/>
<line x1="620" y1="310" x2="660" y2="310" stroke="#263b3e" stroke-width="4"/>
<text x="150" y="375" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">反应物</text>
<text x="650" y="350" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">产物</text>
<text x="375" y="142" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">无催化剂</text>
<text x="375" y="220" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="start">有催化剂</text>
<text x="755" y="175" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">催化剂提供较低能垒路径</text>
<text x="755" y="217" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">通常改变反应速率</text>
<text x="755" y="259" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">图中端点能量差保持相同</text>
<text x="755" y="301" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">真实反应可能有多个中间步骤</text>
<text x="600" y="486" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">该图只表示能量与路径的关系，不代表某一种具体反应。</text>
</svg>