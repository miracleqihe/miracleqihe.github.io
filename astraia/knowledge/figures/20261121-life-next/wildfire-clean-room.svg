<text x="420" y="412" fill="#60816a" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="700" text-anchor="middle">颗粒过滤</text>
<path d="M 70 145 Q 125 110 175 145 Q 220 115 280 150" fill="none" stroke="#a59e96" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
<text x="755" y="175" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">关注当地烟雾与撤离公告</text>
<text x="755" y="217" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">安全时关窗并使用过滤设备</text>
<text x="755" y="259" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">室内避免额外产生烟雾</text>
<text x="755" y="301" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">外出时选合适贴合的防颗粒口罩</text>
<text x="600" y="486" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">颗粒物口罩不防一氧化碳；不要在室内使用燃烧设备。</text>
