<path d="M 360 287.0 L 360 319.0 M 360 297.0 L 343.0 309.0 M 360 297.0 L 377.0 309.0 M 360 319.0 L 346.0 343.0 M 360 319.0 L 374.0 343.0" fill="none" stroke="#263b3e" stroke-width="4.0" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="360" cy="340" r="33" fill="none" stroke="#a94d37" stroke-width="3"/>
