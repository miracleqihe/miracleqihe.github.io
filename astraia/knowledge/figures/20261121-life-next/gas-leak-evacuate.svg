<line x1="214" y1="287" x2="241" y2="334" stroke="#a94d37" stroke-width="4"/>
<line x1="241" y1="287" x2="214" y2="334" stroke="#a94d37" stroke-width="4"/>
<text x="220" y="443" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="middle">屋内不碰开关</text>
<rect x="550" y="290" width="20" height="34" rx="3" fill="#f5eee3" stroke="#263b3e" stroke-width="2"/>
<text x="590" y="314" fill="#326f80" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="19" font-weight="400" text-anchor="start">安全处报警</text>
<text x="755" y="175" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">停止使用明火与电器开关</text>
<text x="755" y="217" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">不在泄漏区域内拨打电话</text>
<text x="755" y="259" fill="#263b3e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="400" text-anchor="start">迅速离开，在安全处报修</text>
<text x="755" y="301" fill="#a94d37" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="21" font-weight="700" text-anchor="start">有人不适时立即呼叫急救</text>
<text x="600" y="486" fill="#526d6e" font-family="Microsoft YaHei, Noto Sans SC, sans-serif" font-size="20" font-weight="400" text-anchor="middle">能安全关闭阀门时再关闭；不要为找源头而滞留。</text>
