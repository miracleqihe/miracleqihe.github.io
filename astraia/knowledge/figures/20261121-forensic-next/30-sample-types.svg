<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">毒理检材：不同样本回答什么</title>
<desc id="desc">各类样本对应不同问题，采集需由专业人员安排</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">毒理检材：不同样本回答什么</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">各类样本对应不同问题，采集需由专业人员安排</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<line x1="420" y1="75" x2="420" y2="446" stroke="#cad8ce" stroke-width="3" stroke-linecap="round"/><line x1="45" y1="255" x2="795" y2="255" stroke="#cad8ce" stroke-width="3" stroke-linecap="round"/><text x="225" y="72" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">血液：采样时循环</text><text x="605" y="72" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">尿液：此前的排出</text><text x="225" y="300" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">毛发：分段与方向</text><text x="605" y="300" font-size="26" fill="#293e44" font-weight="700" text-anchor="middle">其他检材：按问题选择</text><path d="M55 155 H165 M105 155 L130 123 M105 155 L130 187" fill="none" stroke="#af7072" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><line x1="180" y1="155" x2="225" y2="155" stroke="#a7835a" stroke-width="4" stroke-linecap="round"/><path d="M 213.6 161.2 L 225 155 L 213.6 148.8" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="105" width="75" height="104" rx="10" fill="#f5f5eb" stroke="#9cae9f" stroke-width="3"/><rect x="257" y="154" width="61" height="48" rx="4" fill="#bc8887" stroke="none" stroke-width="0"/><rect x="250" y="92" width="75" height="18" rx="3" fill="#d5e0d6" stroke="#9cae9f" stroke-width="2"/><path d="M467 118 Q475 85 510 90 Q545 85 553 118 Q565 165 510 180 Q455 165 467 118Z" fill="#cbdedb" stroke="#89a8a1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M510 180 V205" fill="none" stroke="#89a8a1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><line x1="565" y1="155" x2="610" y2="155" stroke="#a7835a" stroke-width="4" stroke-linecap="round"/><path d="M 598.6 161.2 L 610 155 L 598.6 148.8" fill="none" stroke="#a7835a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="115" width="75" height="90" rx="8" fill="#f5f5eb" stroke="#9cae9f" stroke-width="3"/><rect x="637" y="160" width="61" height="38" rx="4" fill="#e3cd91" stroke="none" stroke-width="0"/><path d="M70 425 Q70 350 125 340 Q165 340 180 385 L180 425Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 355 H340" fill="none" stroke="#826d60" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><line x1="210" y1="335" x2="210" y2="375" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="335" x2="270" y2="375" stroke="#af7072" stroke-width="3" stroke-linecap="round"/><path d="M470 420 Q470 345 510 330 Q555 340 555 420Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="486" y="345" width="52" height="48" rx="12" fill="#f4e6d8" stroke="#bda599" stroke-width="3"/><path d="M630 342 Q650 322 665 343 L650 367 L690 405 L715 390 Q733 403 716 420 Q702 432 686 418 L636 375 Q615 380 607 364 Q603 348 630 342Z" fill="#ebe4d8" stroke="#b2a28d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="238" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">核对采样时间、部位和治疗</text><text x="605" y="238" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">检出时间因物质和方法而变</text><text x="230" y="455" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">近根端与样本处理需要记录</text><text x="605" y="455" font-size="23" fill="#596b6d" font-weight="400" text-anchor="middle">指甲、骨或其他组织可补充</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">血液更接近采样时循环中的目标</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">物情况。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">尿液反映此前排出过程，不能单</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">独证明当时受影响。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">毛发及其他组织可提供特定情况</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">下的补充线索。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">检测范围与时间取决于物质、样本及实验方法。</text>
</g></svg>