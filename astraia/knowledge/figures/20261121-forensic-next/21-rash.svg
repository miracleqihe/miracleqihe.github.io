<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">紫红点：同时看全身状态</title>
<desc id="desc">局部点状或片状改变有多种原因</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">紫红点：同时看全身状态</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">局部点状或片状改变有多种原因</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<path d="M110 145 Q145 120 225 130 L240 250 Q230 310 290 335 L270 370 Q170 355 160 300Z" fill="#ead7cd" stroke="#b49284" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="170" cy="176" r="4" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="188" cy="193" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="201" cy="169" r="3" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="210" cy="210" r="4" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="179" cy="223" r="3" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="195" cy="239" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="217" cy="259" r="4" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="203" cy="279" r="3" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="230" cy="293" r="5" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="245" cy="318" r="3" fill="#af7072" stroke="none" stroke-width="3"/><line x1="202" y1="210" x2="390" y2="120" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="202" cy="210" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="398" y="128" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">针尖样点或紫斑</text><text x="390" y="210" font-size="26" fill="#293e44" font-weight="700" text-anchor="start">同时留意：</text><text x="390" y="260" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">发热、呼吸快</text><text x="390" y="310" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">明显虚弱、意识异常</text><text x="390" y="405" font-size="24" fill="#596b6d" font-weight="400" text-anchor="start">颜色和可见度受肤色、光线影响</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">紫红点可与感染、药物和其他情</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">况有关。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">伴发热、呼吸急促、明显虚弱或</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">意识变化要警惕。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">症状进展迅速时立即急救，勿等</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">待出疹齐全。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">深肤色或光线不足时颜色不易辨认，观察整体状态。</text>
</g></svg>