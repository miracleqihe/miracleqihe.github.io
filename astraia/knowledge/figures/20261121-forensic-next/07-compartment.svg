<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">骨筋膜室：肌肉、血管与神经</title>
<desc id="desc">肢体横断面示意筋膜包绕的有限空间</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">骨筋膜室：肌肉、血管与神经</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">肢体横断面示意筋膜包绕的有限空间</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<circle cx="285" cy="235" r="165" fill="#ead7cd" stroke="#b49284" stroke-width="4"/><circle cx="285" cy="235" r="139" fill="#d7b4a9" stroke="#917d73" stroke-width="8"/><path d="M285 100 L285 370 M150 235 H420 M190 140 L380 330" fill="none" stroke="#9e8b7f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="255" cy="205" r="43" fill="#eee5d7" stroke="#b4a494" stroke-width="3"/><circle cx="330" cy="270" r="24" fill="#eee5d7" stroke="#b4a494" stroke-width="3"/><circle cx="365" cy="192" r="10" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="349" cy="192" r="9" fill="#668f98" stroke="none" stroke-width="3"/><circle cx="333" cy="192" r="8" fill="#a7835a" stroke="none" stroke-width="3"/><line x1="225" y1="120" x2="495" y2="108" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="225" cy="120" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="503" y="116" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">筋膜包裹</text><line x1="285" y1="152" x2="495" y2="196" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="285" cy="152" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="503" y="204" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">肌肉群</text><line x1="350" y1="192" x2="495" y2="285" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="350" cy="192" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="503" y="293" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">血管和神经</text><line x1="255" y1="205" x2="495" y2="374" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="255" cy="205" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="503" y="382" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">骨骼</text><text x="286" y="450" font-size="25" fill="#596b6d" font-weight="400" text-anchor="middle">横断面为结构示意</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">骨折、挤压或肿胀可使室内压力</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">升高。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">越来越重的疼痛、麻木或无力值</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">得警惕。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">急性骨筋膜室综合征需要紧急处</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">理。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">疑似时立即就医，不要等待皮肤颜色明显改变。</text>
</g></svg>