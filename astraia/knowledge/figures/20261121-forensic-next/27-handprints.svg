roke="#b7a389" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M625 218 Q695 145 765 218 Q757 260 695 263 Q633 260 625 218" fill="none" stroke="#b7a389" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="145" y="75" font-size="27" fill="#293e44" font-weight="700" text-anchor="middle">可见手印</text><text x="420" y="75" font-size="27" fill="#293e44" font-weight="700" text-anchor="middle">潜在手印</text><text x="695" y="75" font-size="27" fill="#293e44" font-weight="700" text-anchor="middle">立体手印</text><text x="145" y="385" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">有色物质转印</text><text x="420" y="385" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">可能不易直接看见</text><text x="695" y="385" font-size="24" fill="#293e44" font-weight="400" text-anchor="middle">软材料形成凹凸</text><text x="420" y="450" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">纹线示意，不代表个人身份</text>
