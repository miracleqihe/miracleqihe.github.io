<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">地高辛中毒：胃肠、心律与视觉</title>
<desc id="desc">服药后出现多处变化时应携药物信息就医</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">地高辛中毒：胃肠、心律与视觉</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">服药后出现多处变化时应携药物信息就医</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(240 105) scale(1.1)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(240 190) scale(0.24)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="228" cy="103" r="5" fill="#293e44" stroke="none" stroke-width="3"/><circle cx="252" cy="103" r="5" fill="#293e44" stroke="none" stroke-width="3"/><path d="M222 285 q18-15 36 0" fill="none" stroke="#a7835a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="239" y1="104" x2="385" y2="105" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="239" cy="104" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="393" y="113" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">视物模糊或颜色异常</text><line x1="240" y1="215" x2="385" y2="200" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="240" cy="215" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="393" y="208" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">心悸、脉搏不规则</text><line x1="240" y1="282" x2="385" y2="295" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="240" cy="282" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="393" y="303" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">恶心、呕吐</text><text x="385" y="397" font-size="25" fill="#596b6d" font-weight="400" text-anchor="start">并非每个人都有视觉变化</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">可能恶心、呕吐、乏力或心悸。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">脉搏不规则、明显晕厥或意识异</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">常需急救。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">有的人视物模糊或颜色异常，也</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">有人没有。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">这些表现可由多种原因造成，需要医疗评估。</text>
</g></svg>