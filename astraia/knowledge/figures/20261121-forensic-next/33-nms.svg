<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">药物变化后：发热、僵硬与意识</title>
<desc id="desc">神经阻滞剂恶性综合征的部分观察线索</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">药物变化后：发热、僵硬与意识</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">神经阻滞剂恶性综合征的部分观察线索</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(250 105) scale(1.05)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M215 210 l-30 45 M285 210 l30 45" fill="none" stroke="#af7072" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 55 q20-20 40 0 M255 55 q20-20 40 0" fill="none" stroke="#a7835a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="250" y1="100" x2="405" y2="125" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="250" cy="100" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="413" y="133" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">意识变化</text><line x1="185" y1="255" x2="405" y2="225" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="185" cy="255" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="413" y="233" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">肌肉僵硬</text><line x1="300" y1="65" x2="405" y2="325" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="300" cy="65" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="413" y="333" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">发热或出汗</text><text x="405" y="405" font-size="24" fill="#596b6d" font-weight="400" text-anchor="start">说明近期药物变化并立即急救</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">发热、明显肌肉僵硬和意识变化</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">可能同时出现。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出汗、心跳加快等表现也可能伴</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">随。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">立即急救，向医护说明近期药物</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">及剂量变化。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">表现并不一定齐全，也可能与其他疾病重叠。</text>
</g></svg>