<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">近景记录细节，并可按程序补拍</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">比例尺。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">救治与现场安全优先，拍照不能耽误救援。</text>
</g></svg>