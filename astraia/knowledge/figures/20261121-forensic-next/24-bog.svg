<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">湿润、低氧和酸性条件可影响组</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">织保存。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">皮肤与骨骼可能呈现不同保存状</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">态。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不同地点和身体部位的保存程度</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">可以差异很大。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">泥炭环境不能套用普通土壤的固定腐败时间。</text>
