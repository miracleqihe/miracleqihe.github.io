e-width="2"/><text x="193" y="270" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">较高环境压力</text><text x="193" y="315" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">气体溶入组织</text><text x="555" y="445" font-size="25" fill="#293e44" font-weight="400" text-anchor="middle">上升后可能出现气泡</text><text x="168" y="95" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">水面</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">潜水上升后可能出现关节痛、皮</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">疹或神经症状。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">症状可在出水后出现，严重时需</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">要紧急救治。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">联系急救并说明潜水经过，按受</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">训程序供氧。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不要再次下水自行加压治疗；由专业医疗人员评估。</text>
</g></svg>