<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">主动脉夹层：原有通道与壁层间</title>
<desc id="desc">横断面示意，假腔位于主动脉壁层之间</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">主动脉夹层：原有通道与壁层间</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">横断面示意，假腔位于主动脉壁层之间</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<circle cx="270" cy="240" r="155" fill="#d9b3a7" stroke="#9f8075" stroke-width="5"/><circle cx="270" cy="240" r="122" fill="#eddbcc" stroke="#ad9484" stroke-width="3"/><path d="M270 119 Q347 120 378 190 Q394 245 357 292 Q334 249 310 209 Q294 185 270 119Z" fill="#ca8f89" stroke="#aa7773" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 119 Q347 120 378 190 Q394 245 357 292" fill="none" stroke="#af7072" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="240" r="85" fill="#f3d1c8" stroke="#bd8c84" stroke-width="4"/><line x1="270" y1="240" x2="505" y2="130" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="270" cy="240" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="513" y="138" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">原有血流腔</text><line x1="344" y1="203" x2="505" y2="230" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="344" cy="203" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="513" y="238" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">壁层间假腔</text><line x1="372" y1="298" x2="505" y2="330" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="372" cy="298" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="513" y="338" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">血管壁</text><text x="270" y="444" font-size="25" fill="#596b6d" font-weight="400" text-anchor="middle">横断面示意</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">血液进入壁层间，可形成相邻的</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">假腔。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">突发严重胸背痛、晕厥或神经异</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">常应立即急救。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">诊断和受累范围需要医院影像等</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">检查。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">疼痛和病变形态因人而异，示意图不能代替诊断。</text>
</g></svg>