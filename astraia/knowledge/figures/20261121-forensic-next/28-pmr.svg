<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">死后再分布：血样位置与组织</title>
<desc id="desc">心腔附近、外周部位和组织的相对位置</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">死后再分布：血样位置与组织</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">心腔附近、外周部位和组织的相对位置</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(285 100) scale(1.12)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(285 165) scale(0.38)"><path d="M0 20 C-50 -36 -94 2 -75 50 C-60 83 -25 106 0 130 C25 106 60 83 75 50 C94 2 50 -36 0 20Z" fill="#d99c98" stroke="#ae7475" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M242 244 Q272 228 313 245 Q302 270 250 269Z" fill="#a97870" stroke="#875e59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M272 325 V428" fill="none" stroke="#af7072" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="285" cy="193" r="8" fill="#af7072" stroke="none" stroke-width="3"/><circle cx="272" cy="410" r="8" fill="#af7072" stroke="none" stroke-width="3"/><line x1="285" y1="193" x2="430" y2="120" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="285" cy="193" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="438" y="128" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">心腔附近的血</text><line x1="280" y1="253" x2="430" y2="220" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="280" cy="253" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="438" y="228" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">组织中的药物</text><line x1="272" y1="410" x2="430" y2="320" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="272" cy="410" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="438" y="328" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">外周部位血液</text><text x="430" y="405" font-size="25" fill="#596b6d" font-weight="400" text-anchor="start">记录部位、时间与保存条件</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">药物可能在死后由组织释放并发</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">生再分布。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">不同部位浓度差异受物质、时间</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">和采样影响。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">应记录采样部位并结合病史和其</text>
<text x="1005" y="515" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">他检验解释。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">心血或外周血读数均不能直接换算成生前精确剂量。</text>
</g></svg>