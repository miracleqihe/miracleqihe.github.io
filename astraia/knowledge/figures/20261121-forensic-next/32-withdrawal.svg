<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">酒精戒断：手抖与严重表现</title>
<desc id="desc">长期大量饮酒者停饮或明显减量后可能出现</desc>
<rect x="1" y="1" width="1498" height="758" rx="14" fill="#fffdf8" stroke="#ded8c9" stroke-width="2"/>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif">
<text x="35" y="49" font-size="40" fill="#293e44" font-weight="700" text-anchor="start">酒精戒断：手抖与严重表现</text>
<text x="37" y="87" font-size="27" fill="#596b6d" font-weight="400" text-anchor="start">长期大量饮酒者停饮或明显减量后可能出现</text>
<rect x="25" y="110" width="900" height="545" rx="10" fill="#f1f5f2" stroke="#d8e3db" stroke-width="2"/>
<g transform="translate(45 120)">
<g transform="translate(250 105) scale(1.05)"><circle cx="0" cy="0" r="29" fill="#ead7cd" stroke="#b49284" stroke-width="3"/><path d="M-34 42 Q0 29 34 42 L44 145 L29 160 L23 278 L7 278 L0 168 L-7 278 L-23 278 L-29 160 L-44 145 Z" fill="#ead7cd" stroke="#b49284" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-35 52 L-69 150 M35 52 L69 150" fill="none" stroke="#b49284" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M166 220 q-15 14 0 28 M334 220 q15 14 0 28" fill="none" stroke="#af7072" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 70 q18-20 36 0 M252 70 q18-20 36 0" fill="none" stroke="#668f98" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="170" y1="236" x2="405" y2="140" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="170" cy="236" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="413" y="148" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">手抖、出汗</text><line x1="250" y1="105" x2="405" y2="235" stroke="#a7835a" stroke-width="2" stroke-linecap="round"/><circle cx="250" cy="105" r="4" fill="#a7835a" stroke="none" stroke-width="3"/><text x="413" y="243" font-size="25" fill="#293e44" font-weight="400" text-anchor="start">焦虑、睡眠变化</text><text x="405" y="330" font-size="25" fill="#af7072" font-weight="700" text-anchor="start">抽搐、发热或明显混乱</text><text x="405" y="378" font-size="25" fill="#af7072" font-weight="700" text-anchor="start">立即急救</text><text x="250" y="450" font-size="24" fill="#596b6d" font-weight="400" text-anchor="middle">表现与出现时机因人而异</text>
</g>
<line x1="949" y1="120" x2="949" y2="650" stroke="#dfe6df" stroke-width="2" stroke-linecap="round"/>
<circle cx="985" cy="159" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="168" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">手抖、出汗、心慌、失眠或恶心</text>
<text x="1005" y="205" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">可能发生。</text>
<circle cx="985" cy="314" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="323" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">抽搐、发热或明显混乱属于紧急</text>
<text x="1005" y="360" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">信号。</text>
<circle cx="985" cy="469" r="5" fill="#a7835a" stroke="none" stroke-width="3"/>
<text x="1005" y="478" font-size="30" fill="#293e44" font-weight="400" text-anchor="start">出现严重表现时立即呼叫急救。</text>
<rect x="25" y="676" width="1450" height="57" rx="7" fill="#f7eee0" stroke="#f7eee0" stroke-width="0"/>
<text x="42" y="714" font-size="27" fill="#785334" font-weight="400" text-anchor="start">不同人出现症状的时间和组合可能不同。</text>
</g></svg>