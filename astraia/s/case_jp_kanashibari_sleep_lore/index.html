<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本｜“金缚”从不动明王法咒到睡眠麻痹俗称的演变 · ASTRAIA</title><meta name="description" content="在日本现代日常语言里，指代睡眠麻痹的惯用词“金缚”（kanashibari，字面意为“像被金属铁链牢牢捆住”）最初并非描述卧室睡眠困厄的医学或怪谈名词。它的语源扎根于日本密教与修验道传统：不动明王法相中左手常持绳索“绢索”（kensaku），象征降伏与束缚邪祟烦恼；古代行者借持诵不动明王咒施展“金缚法”，旨在将妖魔或敌手定身封锁、使其寸步难行。"><meta property="og:type" content="article"><meta property="og:title" content="日本｜“金缚”从不动明王法咒到睡眠麻痹俗称的演变 · ASTRAIA"><meta property="og:description" content="在日本现代日常语言里，指代睡眠麻痹的惯用词“金缚”（kanashibari，字面意为“像被金属铁链牢牢捆住”）最初并非描述卧室睡眠困厄的医学或怪谈名词。它的语源扎根于日本密教与修验道传统：不动明王法相中左手常持绳索“绢索”（kensaku），象征降伏与束缚邪祟烦恼；古代行者借持诵不动明王咒施展“金缚法”，旨在将妖魔或敌手定身封锁、使其寸步难行。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_jp_kanashibari_sleep_lore/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-1.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="日本｜“金缚”从不动明王法咒到睡眠麻痹俗称的演变 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_jp_kanashibari_sleep_lore",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 日本｜“金缚”从不动明王法咒到睡眠麻痹俗称的演变。<a href="../../syzygy/?dim=umbra&amp;story=case_jp_kanashibari_sleep_lore">点击阅读</a></p></body></html>
