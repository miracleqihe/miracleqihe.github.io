<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>厄尔布尔士山脉｜《列王纪》中的神鸟西摩格 · ASTRAIA</title><meta name="description" content="在伊朗高原的古代文献与史诗叙事里，西摩格（Simurgh，中古波斯语 sēnmurw）是一只栖息于厄尔布尔士山巅的巨型神鸟。语源学追溯至阿维斯陀语的“萨埃纳鸟”，早期萨珊艺术常将其刻画为兼有禽翼、狗首或狮爪的复合神兽；在菲尔多西十世纪末的波斯史诗《列王纪》中，它进一步成为通晓医术与人言的庇护者。"><meta property="og:type" content="article"><meta property="og:title" content="厄尔布尔士山脉｜《列王纪》中的神鸟西摩格 · ASTRAIA"><meta property="og:description" content="在伊朗高原的古代文献与史诗叙事里，西摩格（Simurgh，中古波斯语 sēnmurw）是一只栖息于厄尔布尔士山巅的巨型神鸟。语源学追溯至阿维斯陀语的“萨埃纳鸟”，早期萨珊艺术常将其刻画为兼有禽翼、狗首或狮爪的复合神兽；在菲尔多西十世纪末的波斯史诗《列王纪》中，它进一步成为通晓医术与人言的庇护者。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_ir_alborz_simurgh_lore/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-2.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="厄尔布尔士山脉｜《列王纪》中的神鸟西摩格 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_ir_alborz_simurgh_lore",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 厄尔布尔士山脉｜《列王纪》中的神鸟西摩格。<a href="../../syzygy/?dim=umbra&amp;story=case_ir_alborz_simurgh_lore">点击阅读</a></p></body></html>
