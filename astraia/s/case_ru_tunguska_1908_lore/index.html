<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯西伯利亚｜1908 年通古斯大爆炸目击笔录、鄂温克阐释与流星空爆记录 · ASTRAIA</title><meta name="description" content="1908 年 6 月 30 日清晨约 7 时 14 分，俄属西伯利亚石泉通古斯河以北的无人泰加林上空骤然撕裂：60 公里外瓦纳瓦拉商站的居民目睹刺眼蓝白色火柱划过天穹，随即炽热气浪灼伤门廊上坐着的人，震波将数百公里外的窗户震碎、令西伯利亚铁路列车摇晃急停；与此同时，全球多地地震仪与气压计录下绕地球传播数圈的大气冲击波，随后数夜欧亚北方夜空亮如白昼。"><meta property="og:type" content="article"><meta property="og:title" content="俄罗斯西伯利亚｜1908 年通古斯大爆炸目击笔录、鄂温克阐释与流星空爆记录 · ASTRAIA"><meta property="og:description" content="1908 年 6 月 30 日清晨约 7 时 14 分，俄属西伯利亚石泉通古斯河以北的无人泰加林上空骤然撕裂：60 公里外瓦纳瓦拉商站的居民目睹刺眼蓝白色火柱划过天穹，随即炽热气浪灼伤门廊上坐着的人，震波将数百公里外的窗户震碎、令西伯利亚铁路列车摇晃急停；与此同时，全球多地地震仪与气压计录下绕地球传播数圈的大气冲击波，随后数夜欧亚北方夜空亮如白昼。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_ru_tunguska_1908_lore/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-3.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="俄罗斯西伯利亚｜1908 年通古斯大爆炸目击笔录、鄂温克阐释与流星空爆记录 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_ru_tunguska_1908_lore",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 俄罗斯西伯利亚｜1908 年通古斯大爆炸目击笔录、鄂温克阐释与流星空爆记录。<a href="../../syzygy/?dim=umbra&amp;story=case_ru_tunguska_1908_lore">点击阅读</a></p></body></html>
