<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>贵州安顺｜屯堡地戏木雕脸子开光与军傩驱邪祭演体系 · ASTRAIA</title><meta name="description" content="流传于贵州安顺市及周边石砌屯堡村寨的“地戏”，被戏剧史与民俗学界公认为罕见的活态“军傩”祭演体系。其源头可溯至明洪武十四年（1381 年）明太祖朱元璋“调北征南”屯戍黔中后留居当地的江南、江淮军户后裔：屯堡先民为在险峻山地保持战备操演习惯并兼顾岁时驱邪纳吉，将江南乡傩、军人祭旗仪式与传统历史演义说唱熔为一体，在村口平地或打谷场“跳神”，故称“地戏”。"><meta property="og:type" content="article"><meta property="og:title" content="贵州安顺｜屯堡地戏木雕脸子开光与军傩驱邪祭演体系 · ASTRAIA"><meta property="og:description" content="流传于贵州安顺市及周边石砌屯堡村寨的“地戏”，被戏剧史与民俗学界公认为罕见的活态“军傩”祭演体系。其源头可溯至明洪武十四年（1381 年）明太祖朱元璋“调北征南”屯戍黔中后留居当地的江南、江淮军户后裔：屯堡先民为在险峻山地保持战备操演习惯并兼顾岁时驱邪纳吉，将江南乡傩、军人祭旗仪式与传统历史演义说唱熔为一体，在村口平地或打谷场“跳神”，故称“地戏”。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_guizhou_dixi_nuo_masks/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-2.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="贵州安顺｜屯堡地戏木雕脸子开光与军傩驱邪祭演体系 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_guizhou_dixi_nuo_masks",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 贵州安顺｜屯堡地戏木雕脸子开光与军傩驱邪祭演体系。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_guizhou_dixi_nuo_masks">点击阅读</a></p></body></html>
