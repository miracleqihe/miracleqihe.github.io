<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俄罗斯乌拉尔山｜1959 年迪亚特洛夫山口登山队事件档案与风雪板崩复盘 · ASTRAIA</title><meta name="description" content="1959 年 1 月底，由乌拉尔工学院毕业生伊戈尔·迪亚特洛夫率领的九名经验丰富的苏联滑雪登山者深入北乌拉尔山脉荒野；2 月 1 日傍晚，队伍在后来被称作“死亡之山”的霍拉特夏赫尔峰东坡挖平积雪扎下大帐篷。数周后搜救队赶到现场时，发现帐篷布面被人从内部以刀割裂，登山靴与厚外衣仍留在帐内，而九组光脚或仅着袜子的脚印一路向下方密林延伸。"><meta property="og:type" content="article"><meta property="og:title" content="俄罗斯乌拉尔山｜1959 年迪亚特洛夫山口登山队事件档案与风雪板崩复盘 · ASTRAIA"><meta property="og:description" content="1959 年 1 月底，由乌拉尔工学院毕业生伊戈尔·迪亚特洛夫率领的九名经验丰富的苏联滑雪登山者深入北乌拉尔山脉荒野；2 月 1 日傍晚，队伍在后来被称作“死亡之山”的霍拉特夏赫尔峰东坡挖平积雪扎下大帐篷。数周后搜救队赶到现场时，发现帐篷布面被人从内部以刀割裂，登山靴与厚外衣仍留在帐内，而九组光脚或仅着袜子的脚印一路向下方密林延伸。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_ru_dyatlov_pass_1959/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-1.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="俄罗斯乌拉尔山｜1959 年迪亚特洛夫山口登山队事件档案与风雪板崩复盘 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_ru_dyatlov_pass_1959",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 俄罗斯乌拉尔山｜1959 年迪亚特洛夫山口登山队事件档案与风雪板崩复盘。<a href="../../syzygy/?dim=umbra&amp;story=case_ru_dyatlov_pass_1959">点击阅读</a></p></body></html>
