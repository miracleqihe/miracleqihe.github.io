<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人触觉错配与在场感诱发 · ASTRAIA</title><meta name="description" content="布兰克（Olaf Blanke）团队在 2014 年发表于《Current Biology》的研究中设计了一组受控实验：受试者伸手操作前方机械装置时，身后的另一台装置同步或延迟在背部给出触觉反馈。一旦自主动作与背部触觉的时间衔接被人为错开，部分健康受试者便真切感到“身后有人靠近”；研究组同时将其与同步对照组及常有“在场感”的神经病变病例作了比对。"><meta property="og:type" content="article"><meta property="og:title" content="机器人触觉错配与在场感诱发 · ASTRAIA"><meta property="og:description" content="布兰克（Olaf Blanke）团队在 2014 年发表于《Current Biology》的研究中设计了一组受控实验：受试者伸手操作前方机械装置时，身后的另一台装置同步或延迟在背部给出触觉反馈。一旦自主动作与背部触觉的时间衔接被人为错开，部分健康受试者便真切感到“身后有人靠近”；研究组同时将其与同步对照组及常有“在场感”的神经病变病例作了比对。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_blanke_robot_presence_2014/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/case_blanke_robot_presence_2014.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="机器人触觉错配与在场感诱发 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_blanke_robot_presence_2014",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 机器人触觉错配与在场感诱发。<a href="../../syzygy/?dim=umbra&amp;story=case_blanke_robot_presence_2014">点击阅读</a></p></body></html>
