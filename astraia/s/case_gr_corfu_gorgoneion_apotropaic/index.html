<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古希腊科孚岛｜阿尔忒弥斯神庙的戈尔工山花 · ASTRAIA</title><meta name="description" content="1911 年起，考古人员在希腊科孚岛帕莱奥波利斯一带发掘阿尔忒弥斯神庙，其石构山花现藏科孚考古博物馆。山花中央是体量巨大的戈尔工形象：面孔正视观者，獠牙毕露，身体呈古风时期常见的屈膝奔跑姿势；两侧可见豹、飞马珀伽索斯及其他人物。博物馆介绍将作品年代约定为公元前 585 年。"><meta property="og:type" content="article"><meta property="og:title" content="古希腊科孚岛｜阿尔忒弥斯神庙的戈尔工山花 · ASTRAIA"><meta property="og:description" content="1911 年起，考古人员在希腊科孚岛帕莱奥波利斯一带发掘阿尔忒弥斯神庙，其石构山花现藏科孚考古博物馆。山花中央是体量巨大的戈尔工形象：面孔正视观者，獠牙毕露，身体呈古风时期常见的屈膝奔跑姿势；两侧可见豹、飞马珀伽索斯及其他人物。博物馆介绍将作品年代约定为公元前 585 年。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_gr_corfu_gorgoneion_apotropaic/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-1.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="古希腊科孚岛｜阿尔忒弥斯神庙的戈尔工山花 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_gr_corfu_gorgoneion_apotropaic",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 古希腊科孚岛｜阿尔忒弥斯神庙的戈尔工山花。<a href="../../syzygy/?dim=umbra&amp;story=case_gr_corfu_gorgoneion_apotropaic">点击阅读</a></p></body></html>
