<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>乾隆三十三年叫魂案（1768） · ASTRAIA</title><meta name="description" content="清乾隆三十三年（1768 年），长江下游一带纷传有人借剪人发辫、探听姓名或施用符咒盗取生魂，游方僧人、乞丐与外乡人频频遭疑。随着地方审讯与奏报上传，乾隆帝下旨严查，原本散处各地的恐慌遂波及多个省份。历史学者孔飞力（Philip A. Kuhn）在 1990 年出版的专著《叫魂：1768 年中国妖术大恐慌》中，据清代档案梳理了朝廷与地方官员处置这批指控的全过程"><meta property="og:type" content="article"><meta property="og:title" content="乾隆三十三年叫魂案（1768） · ASTRAIA"><meta property="og:description" content="清乾隆三十三年（1768 年），长江下游一带纷传有人借剪人发辫、探听姓名或施用符咒盗取生魂，游方僧人、乞丐与外乡人频频遭疑。随着地方审讯与奏报上传，乾隆帝下旨严查，原本散处各地的恐慌遂波及多个省份。历史学者孔飞力（Philip A. Kuhn）在 1990 年出版的专著《叫魂：1768 年中国妖术大恐慌》中，据清代档案梳理了朝廷与地方官员处置这批指控的全过程"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_china_soulstealers_1768/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/case_china_soulstealers_1768.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="乾隆三十三年叫魂案（1768） · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=sidera&story=case_china_soulstealers_1768",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 乾隆三十三年叫魂案（1768）。<a href="../../syzygy/?dim=sidera&amp;story=case_china_soulstealers_1768">点击阅读</a></p></body></html>
