<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南印度吉登伯勒姆｜湿婆“舞王”纳塔罗阇宇宙之舞神话 · ASTRAIA</title><meta name="description" content="南印度梯莱（吉登伯勒姆）圣地传说的核心情节，讲述毗湿奴邀湿婆前往塔鲁伽森林折服一批自满于苦行与祭祀法力的仙人。湿婆化作乞丐圣者、毗湿奴化作美妇同行，令众仙妻室神魂颠倒，仙人们暴怒之下集念祭火先后唤出猛虎、毒蛇与代表愚昧遗忘的矮鬼阿帕斯玛拉扑向乞丐。湿婆轻剥虎皮披腰、揽毒蛇饰颈，随后右足稳稳踏住阿帕斯玛拉的脊背，在众仙注视下起舞。"><meta property="og:type" content="article"><meta property="og:title" content="南印度吉登伯勒姆｜湿婆“舞王”纳塔罗阇宇宙之舞神话 · ASTRAIA"><meta property="og:description" content="南印度梯莱（吉登伯勒姆）圣地传说的核心情节，讲述毗湿奴邀湿婆前往塔鲁伽森林折服一批自满于苦行与祭祀法力的仙人。湿婆化作乞丐圣者、毗湿奴化作美妇同行，令众仙妻室神魂颠倒，仙人们暴怒之下集念祭火先后唤出猛虎、毒蛇与代表愚昧遗忘的矮鬼阿帕斯玛拉扑向乞丐。湿婆轻剥虎皮披腰、揽毒蛇饰颈，随后右足稳稳踏住阿帕斯玛拉的脊背，在众仙注视下起舞。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_in_chidambaram_shiva_nataraja/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-1.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="南印度吉登伯勒姆｜湿婆“舞王”纳塔罗阇宇宙之舞神话 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_in_chidambaram_shiva_nataraja",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 南印度吉登伯勒姆｜湿婆“舞王”纳塔罗阇宇宙之舞神话。<a href="../../syzygy/?dim=umbra&amp;story=case_in_chidambaram_shiva_nataraja">点击阅读</a></p></body></html>
