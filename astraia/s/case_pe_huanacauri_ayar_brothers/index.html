<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>瓦纳卡乌里山｜阿亚尔四兄弟金杖寻地建都与化为护城圣石神话 · ASTRAIA</title><meta name="description" content="据 1572 年佩德罗·萨米恩托·德·甘博亚在库斯科采集氏族证词编成的《印加史》记载，创世神维拉科查命阿亚尔四兄弟（曼科、奥卡、卡奇、乌丘）与四位玛玛姐妹自帕卡里坦博山“富贵之窗”洞穴走出，携金杖率十个氏族北上寻觅沃土。途中神力暴烈的卡奇被诱回山洞封死，其余兄妹行至库斯科近郊山巅时望见天际彩虹吉兆，遂名此山为“瓦纳卡乌里”。"><meta property="og:type" content="article"><meta property="og:title" content="瓦纳卡乌里山｜阿亚尔四兄弟金杖寻地建都与化为护城圣石神话 · ASTRAIA"><meta property="og:description" content="据 1572 年佩德罗·萨米恩托·德·甘博亚在库斯科采集氏族证词编成的《印加史》记载，创世神维拉科查命阿亚尔四兄弟（曼科、奥卡、卡奇、乌丘）与四位玛玛姐妹自帕卡里坦博山“富贵之窗”洞穴走出，携金杖率十个氏族北上寻觅沃土。途中神力暴烈的卡奇被诱回山洞封死，其余兄妹行至库斯科近郊山巅时望见天际彩虹吉兆，遂名此山为“瓦纳卡乌里”。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_pe_huanacauri_ayar_brothers/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/case_pe_huanacauri_ayar_brothers.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="瓦纳卡乌里山｜阿亚尔四兄弟金杖寻地建都与化为护城圣石神话 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_pe_huanacauri_ayar_brothers",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 瓦纳卡乌里山｜阿亚尔四兄弟金杖寻地建都与化为护城圣石神话。<a href="../../syzygy/?dim=umbra&amp;story=case_pe_huanacauri_ayar_brothers">点击阅读</a></p></body></html>
