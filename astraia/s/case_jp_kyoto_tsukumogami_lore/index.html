<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本京都｜室町《付丧神记》百年器物成精与百鬼夜行 · ASTRAIA</title><meta name="description" content="日本室町时代流传下来的御伽草子绘卷《付丧神记》，把妖怪想象直接植根于京都庶民家庭的器物使用周期之中。故事讲述京城贵族与百姓在年末“煤拂”（大扫除）时，将服务将近百年、磨损残破的琵琶、茶釜、雨伞、草履与数珠一并丢弃在街角路旁；这些旧物怨愤人类忘恩负义，决意在立春前夜“节分”集结化妖，组成声势浩大的“百鬼夜行”在京都街巷作祟。"><meta property="og:type" content="article"><meta property="og:title" content="日本京都｜室町《付丧神记》百年器物成精与百鬼夜行 · ASTRAIA"><meta property="og:description" content="日本室町时代流传下来的御伽草子绘卷《付丧神记》，把妖怪想象直接植根于京都庶民家庭的器物使用周期之中。故事讲述京城贵族与百姓在年末“煤拂”（大扫除）时，将服务将近百年、磨损残破的琵琶、茶釜、雨伞、草履与数珠一并丢弃在街角路旁；这些旧物怨愤人类忘恩负义，决意在立春前夜“节分”集结化妖，组成声势浩大的“百鬼夜行”在京都街巷作祟。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_jp_kyoto_tsukumogami_lore/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-5.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="日本京都｜室町《付丧神记》百年器物成精与百鬼夜行 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_jp_kyoto_tsukumogami_lore",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 日本京都｜室町《付丧神记》百年器物成精与百鬼夜行。<a href="../../syzygy/?dim=umbra&amp;story=case_jp_kyoto_tsukumogami_lore">点击阅读</a></p></body></html>
