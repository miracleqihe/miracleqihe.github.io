<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岭南广西｜宋代《岭外代答》挑生食蛊与历代畜蛊禁令档案 · ASTRAIA</title><meta name="description" content="宋代岭南风土名著周去非《岭外代答》卷十《志异门》与范成大《桂海虞衡志》均设专条记述当地“挑生”与“蛊毒”忌讳。《岭外代答》写道，广南所谓挑生，指以鱼肉款待远客之际暗行厌胜，令食入腹中之物“反生”作祟，致胸膈窒痛闷绝，传闻死者魂魄将阴役于施术者之家；书中所引雷州推官李寿翁审案时，甚至当庭令疑犯覆碗施法，启视鱼肉竟呈毛发滋生之状，遂依法定罪。"><meta property="og:type" content="article"><meta property="og:title" content="岭南广西｜宋代《岭外代答》挑生食蛊与历代畜蛊禁令档案 · ASTRAIA"><meta property="og:description" content="宋代岭南风土名著周去非《岭外代答》卷十《志异门》与范成大《桂海虞衡志》均设专条记述当地“挑生”与“蛊毒”忌讳。《岭外代答》写道，广南所谓挑生，指以鱼肉款待远客之际暗行厌胜，令食入腹中之物“反生”作祟，致胸膈窒痛闷绝，传闻死者魂魄将阴役于施术者之家；书中所引雷州推官李寿翁审案时，甚至当庭令疑犯覆碗施法，启视鱼肉竟呈毛发滋生之状，遂依法定罪。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_lingnan_tiaosheng_gu/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-0.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="岭南广西｜宋代《岭外代答》挑生食蛊与历代畜蛊禁令档案 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_lingnan_tiaosheng_gu",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 岭南广西｜宋代《岭外代答》挑生食蛊与历代畜蛊禁令档案。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_lingnan_tiaosheng_gu">点击阅读</a></p></body></html>
