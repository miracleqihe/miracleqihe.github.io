<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长白山天池｜六个黑点和水面的长纹 · ASTRAIA</title><meta name="description" content="据《北京晨报》2007 年 9 月 3 日报道，前一日（9 月 2 日）一批游客在长白山南坡俯望天池时，随队司机李军先注意到水面泛起波纹，继而借望远镜辨出六个黑点。据他回忆，黑点分前后两组游动，折向东坡时溅起一阵水花，随后尽数没入湖中；同团游客拍下了照片。该报道还提及当年 8 月另外两次目击，各批观者对水下物体的形状与颜色描述不一。"><meta property="og:type" content="article"><meta property="og:title" content="长白山天池｜六个黑点和水面的长纹 · ASTRAIA"><meta property="og:description" content="据《北京晨报》2007 年 9 月 3 日报道，前一日（9 月 2 日）一批游客在长白山南坡俯望天池时，随队司机李军先注意到水面泛起波纹，继而借望远镜辨出六个黑点。据他回忆，黑点分前后两组游动，折向东坡时溅起一阵水花，随后尽数没入湖中；同团游客拍下了照片。该报道还提及当年 8 月另外两次目击，各批观者对水下物体的形状与颜色描述不一。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_changbaishan_tianchi_wakes_2007/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/case_cn_changbaishan_tianchi_wakes_2007.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="长白山天池｜六个黑点和水面的长纹 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_changbaishan_tianchi_wakes_2007",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 长白山天池｜六个黑点和水面的长纹。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_changbaishan_tianchi_wakes_2007">点击阅读</a></p></body></html>
