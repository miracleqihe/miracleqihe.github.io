<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云南滇中｜传统民居屋脊陶塑“瓦猫”镇宅吞煞民俗 · ASTRAIA</title><meta name="description" content="在云南滇中与滇西的传统土木结构民居屋顶正脊中央、或大门照壁与门楼之上，常稳踞着一尊粗陶或琉璃烧制的奇异蹲兽——“瓦猫”。其虽以“猫”为名，造型却多作狮首虎态：圆眼怒瞪、双耳高竖、阔口大张如吞吸四方气流，前爪按伏筒瓦，胸腹往往开有通气孔洞。当地民谚素称“猫容虎劲”，一旦新屋落成或邻近遇有道路直冲、屋脊相射，主人须择吉延请工匠诵祝“开光”，将瓦猫稳安于屋脊之上。"><meta property="og:type" content="article"><meta property="og:title" content="云南滇中｜传统民居屋脊陶塑“瓦猫”镇宅吞煞民俗 · ASTRAIA"><meta property="og:description" content="在云南滇中与滇西的传统土木结构民居屋顶正脊中央、或大门照壁与门楼之上，常稳踞着一尊粗陶或琉璃烧制的奇异蹲兽——“瓦猫”。其虽以“猫”为名，造型却多作狮首虎态：圆眼怒瞪、双耳高竖、阔口大张如吞吸四方气流，前爪按伏筒瓦，胸腹往往开有通气孔洞。当地民谚素称“猫容虎劲”，一旦新屋落成或邻近遇有道路直冲、屋脊相射，主人须择吉延请工匠诵祝“开光”，将瓦猫稳安于屋脊之上。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_yunnan_wamao_roof_guardian/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-1.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="云南滇中｜传统民居屋脊陶塑“瓦猫”镇宅吞煞民俗 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_yunnan_wamao_roof_guardian",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 云南滇中｜传统民居屋脊陶塑“瓦猫”镇宅吞煞民俗。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_yunnan_wamao_roof_guardian">点击阅读</a></p></body></html>
