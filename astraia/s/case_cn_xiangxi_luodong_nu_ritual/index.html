<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湖南湘西｜落洞习俗、洞神冥婚想象与现代精神医学民俗志 · ASTRAIA</title><meta name="description" content="在湖南湘西苗族、土家族等山地村寨流传的口述民俗中，“落洞”（亦称“落花洞女”）常与赶尸、放蛊并称区域奇俗。当地旧俗传言，容貌秀丽、性情内向的未婚少女若突然神情恍惚、缄默绝食、独语不休或独自游荡于山涧溶洞之畔，便被视为遭山洞中的“洞神”看中而“勾魂迎娶”；若家人请巫师祈禳无效而女子最终郁结夭亡或投崖溺水，葬礼甚至照婚嫁“喜丧”仪规办理，称为完婚归神。"><meta property="og:type" content="article"><meta property="og:title" content="湖南湘西｜落洞习俗、洞神冥婚想象与现代精神医学民俗志 · ASTRAIA"><meta property="og:description" content="在湖南湘西苗族、土家族等山地村寨流传的口述民俗中，“落洞”（亦称“落花洞女”）常与赶尸、放蛊并称区域奇俗。当地旧俗传言，容貌秀丽、性情内向的未婚少女若突然神情恍惚、缄默绝食、独语不休或独自游荡于山涧溶洞之畔，便被视为遭山洞中的“洞神”看中而“勾魂迎娶”；若家人请巫师祈禳无效而女子最终郁结夭亡或投崖溺水，葬礼甚至照婚嫁“喜丧”仪规办理，称为完婚归神。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_xiangxi_luodong_nu_ritual/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-6.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="湖南湘西｜落洞习俗、洞神冥婚想象与现代精神医学民俗志 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_xiangxi_luodong_nu_ritual",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 湖南湘西｜落洞习俗、洞神冥婚想象与现代精神医学民俗志。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_xiangxi_luodong_nu_ritual">点击阅读</a></p></body></html>
