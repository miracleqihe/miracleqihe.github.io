<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湘西辰州｜“赶尸”符箓铃铛传闻与客死归葬习俗的民俗学辨析 · ASTRAIA</title><meta name="description" content="在外人眼中的湘西三大神秘传闻里，“赶尸”（又称移灵）以高度戏剧化的视觉意象流传最广：传闻湘西山道崎岖难行舟车，客死他乡者家属遂重金延请会念“辰州符”的赶尸匠，夜深之际于尸首额前贴一道朱砂黄符，前人执摄魂铃、提灯笼引路，背后戴草帽、披黑袍的数具尸体便依铃声蹦跳或踏步前行，昼伏夜出投宿“死尸客栈”，直到千里归葬祖茔。"><meta property="og:type" content="article"><meta property="og:title" content="湘西辰州｜“赶尸”符箓铃铛传闻与客死归葬习俗的民俗学辨析 · ASTRAIA"><meta property="og:description" content="在外人眼中的湘西三大神秘传闻里，“赶尸”（又称移灵）以高度戏剧化的视觉意象流传最广：传闻湘西山道崎岖难行舟车，客死他乡者家属遂重金延请会念“辰州符”的赶尸匠，夜深之际于尸首额前贴一道朱砂黄符，前人执摄魂铃、提灯笼引路，背后戴草帽、披黑袍的数具尸体便依铃声蹦跳或踏步前行，昼伏夜出投宿“死尸客栈”，直到千里归葬祖茔。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_xiangxi_gan_shi_ritual/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-3.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="湘西辰州｜“赶尸”符箓铃铛传闻与客死归葬习俗的民俗学辨析 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_xiangxi_gan_shi_ritual",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 湘西辰州｜“赶尸”符箓铃铛传闻与客死归葬习俗的民俗学辨析。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_xiangxi_gan_shi_ritual">点击阅读</a></p></body></html>
