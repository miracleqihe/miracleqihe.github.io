<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云南滇中｜昆明与西南“滚蛋收魂”验蛊祈禳及非常意识状态民俗志 · ASTRAIA</title><meta name="description" content="在云南昆明及滇中、黔桂多民族交融的城乡民俗中，流行一种兼具“收魂驱惊”与“测蛊辨邪”双重意涵的体表仪轨——“滚蛋”（或称滚鸡蛋、滚蛊）。当幼童夜啼惊厥、成人突发昏眩、胃痛胸闷或陷入神情呆滞的恍惚状态时，家人或民间师婆常煮熟一枚完整去壳（或带壳）热鸡蛋，有时内嵌一枚银元或银簪，自受惊者额头、胸腹至四肢反复滚动念咒，随即将蛋剥开或剖半查验：若见蛋黄表面出现暗青发"><meta property="og:type" content="article"><meta property="og:title" content="云南滇中｜昆明与西南“滚蛋收魂”验蛊祈禳及非常意识状态民俗志 · ASTRAIA"><meta property="og:description" content="在云南昆明及滇中、黔桂多民族交融的城乡民俗中，流行一种兼具“收魂驱惊”与“测蛊辨邪”双重意涵的体表仪轨——“滚蛋”（或称滚鸡蛋、滚蛊）。当幼童夜啼惊厥、成人突发昏眩、胃痛胸闷或陷入神情呆滞的恍惚状态时，家人或民间师婆常煮熟一枚完整去壳（或带壳）热鸡蛋，有时内嵌一枚银元或银簪，自受惊者额头、胸腹至四肢反复滚动念咒，随即将蛋剥开或剖半查验：若见蛋黄表面出现暗青发"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_kunming_gungu_egg_rite/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-3.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="云南滇中｜昆明与西南“滚蛋收魂”验蛊祈禳及非常意识状态民俗志 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_kunming_gungu_egg_rite",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 云南滇中｜昆明与西南“滚蛋收魂”验蛊祈禳及非常意识状态民俗志。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_kunming_gungu_egg_rite">点击阅读</a></p></body></html>
