<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荆楚与中原｜端午五毒符、艾虎雄黄与护儿虎头鞋帽岁时镇物 · ASTRAIA</title><meta name="description" content="农历五月仲夏时节，南方梅雨渐盛、气温骤升而蛇虫滋生，传统历书素有“恶月”“毒五月”之忌，由此孕育出中国岁时镇物中最为密集的防御系统。南朝梁宗懔《荆楚岁时记》记载，五月五日鸡未鸣时采艾草扎为人偶、悬于门户之上“以禳毒气”，并以五彩丝系臂谓之“辟兵”；《后汉书·礼仪志》亦详录仲夏以朱索、五色印饰门户止恶气之官制。至明清时期，清代富察敦崇《燕京岁时记》等岁时志书进"><meta property="og:type" content="article"><meta property="og:title" content="荆楚与中原｜端午五毒符、艾虎雄黄与护儿虎头鞋帽岁时镇物 · ASTRAIA"><meta property="og:description" content="农历五月仲夏时节，南方梅雨渐盛、气温骤升而蛇虫滋生，传统历书素有“恶月”“毒五月”之忌，由此孕育出中国岁时镇物中最为密集的防御系统。南朝梁宗懔《荆楚岁时记》记载，五月五日鸡未鸣时采艾草扎为人偶、悬于门户之上“以禳毒气”，并以五彩丝系臂谓之“辟兵”；《后汉书·礼仪志》亦详录仲夏以朱索、五色印饰门户止恶气之官制。至明清时期，清代富察敦崇《燕京岁时记》等岁时志书进"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_duanwu_wudu_tiger_charm/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-7.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="荆楚与中原｜端午五毒符、艾虎雄黄与护儿虎头鞋帽岁时镇物 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_duanwu_wudu_tiger_charm",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 荆楚与中原｜端午五毒符、艾虎雄黄与护儿虎头鞋帽岁时镇物。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_duanwu_wudu_tiger_charm">点击阅读</a></p></body></html>
