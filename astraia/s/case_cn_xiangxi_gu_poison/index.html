<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>江南与湘西｜隋唐至明清地方志、医书中的蓄蛊毒与巫蛊焦虑 · ASTRAIA</title><meta name="description" content="“蛊”（从虫从皿）在中国正史地理志与历代医典中留有长期记录。《隋书·地理志下》在述及江南数郡民俗时写道：“五月五日聚百种虫，大者至蛇，小者至虱，合置器中，令自相啖，余一种存者留之”，谓之“蛊”以暗害人命、图取财物；隋巢元方《诸病源候论》卷二十六《蛊毒病诸候下》与明李时珍《本草纲目》亦设专目，分述蛇蛊、金蚕蛊、挑生蛊等症状如腹痛呕血、昏厥消瘦及相应解毒药方。"><meta property="og:type" content="article"><meta property="og:title" content="江南与湘西｜隋唐至明清地方志、医书中的蓄蛊毒与巫蛊焦虑 · ASTRAIA"><meta property="og:description" content="“蛊”（从虫从皿）在中国正史地理志与历代医典中留有长期记录。《隋书·地理志下》在述及江南数郡民俗时写道：“五月五日聚百种虫，大者至蛇，小者至虱，合置器中，令自相啖，余一种存者留之”，谓之“蛊”以暗害人命、图取财物；隋巢元方《诸病源候论》卷二十六《蛊毒病诸候下》与明李时珍《本草纲目》亦设专目，分述蛇蛊、金蚕蛊、挑生蛊等症状如腹痛呕血、昏厥消瘦及相应解毒药方。"><meta property="og:url" content="https://miracleqihe.github.io/astraia/s/case_cn_xiangxi_gu_poison/"><meta property="og:image" content="https://miracleqihe.github.io/astraia/og/shared-3.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="江南与湘西｜隋唐至明清地方志、医书中的蓄蛊毒与巫蛊焦虑 · Astraia 星图"><meta name="twitter:card" content="summary_large_image"><script>const target=new URL("../../syzygy/?dim=umbra&story=case_cn_xiangxi_gu_poison",location.href);for(const [k,v] of new URLSearchParams(location.search))if(k!=='story')target.searchParams.set(k,v);location.replace(target.href);</script></head><body><p>正在打开 江南与湘西｜隋唐至明清地方志、医书中的蓄蛊毒与巫蛊焦虑。<a href="../../syzygy/?dim=umbra&amp;story=case_cn_xiangxi_gu_poison">点击阅读</a></p></body></html>
